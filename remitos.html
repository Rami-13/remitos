<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remitos — Servimac</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html {}
body {
  font-family: 'IBM Plex Sans', system-ui, sans-serif;
  background: #f3efe6; color: #181613;
  min-height: 100vh; font-size: 14px; line-height: 1.5;
}
:root {
  --paper: #f3efe6; --paper-2: #e9e3d5; --ink: #181613; --ink-soft: #4a4540;
  --muted: #8a8175; --rule: #cfc6b2; --rule-soft: #ddd5c2;
  --accent: #b8431a; --accent-soft: #f4dccc; --danger: #8b1c1c; --ok: #2d6a4f;
}
input, textarea, select, button { font-family: inherit; color: inherit; }

.display { font-family: 'Archivo', sans-serif; font-stretch: 75%; font-weight: 700; letter-spacing: -.01em; }
.mono    { font-family: 'IBM Plex Mono', monospace; }
.label-tiny { font-family: 'Archivo', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

.container { max-width: 1200px; margin: 0 auto; padding: 32px 24px; }
.toolbar   { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.field { background: #fff; border: 1px solid var(--rule); padding: 9px 11px; font-size: 14px; width: 100%; outline: none; transition: border-color .12s, box-shadow .12s; }
.field:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(0,0,0,.07); }
textarea.field { resize: vertical; min-height: 36px; }

.btn { font-family: 'Archivo', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; padding: 10px 16px; min-height: 44px; border: 1px solid var(--ink); background: var(--ink); color: var(--paper); cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: all .12s; white-space: nowrap; }
.btn:hover     { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-ghost     { background: transparent; color: var(--ink); }
.btn-ghost:hover { background: var(--ink); color: var(--paper); }
.btn-outline   { background: transparent; color: var(--ink); border-color: var(--ink); }
.btn-outline:hover { background: var(--ink); color: var(--paper); }
.btn-danger    { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn-danger:hover { background: var(--danger); color: #fff; }
.btn-sm        { padding: 7px 12px; font-size: 11px; min-height: 36px; }
.btn-icon      { padding: 10px; border-color: var(--rule); background: transparent; color: var(--ink-soft); min-width: 44px; min-height: 44px; justify-content: center; }
.btn-icon:hover { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.btn:disabled  { opacity: .4; cursor: not-allowed; }
.btn svg       { display: block; }
.btn-add-equipo { width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px; margin-top: 14px; font-size: 14px; min-height: 52px; background: var(--ok); border-color: var(--ok); color: #fff; border-width: 2px; font-weight: 700; }
.btn-add-equipo:hover { background: #1e5c3d; border-color: #1e5c3d; }

.grid-doc   { display: grid; grid-template-columns: 160px 190px 190px 1fr; gap: 14px; margin-bottom: 14px; }
.grid-cli-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 14px; }
.grid-cli-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.grid-card  { display: grid; grid-template-columns: 80px 1fr auto; gap: 16px; align-items: center; }

.remito-card { background: #fff; border: 1px solid var(--rule); padding: 18px 20px; cursor: pointer; transition: transform .12s, border-color .12s, box-shadow .12s; }
.remito-card:hover { border-color: var(--ink); box-shadow: 4px 4px 0 var(--ink); transform: translate(-2px,-2px); }
.badge { display: inline-flex; align-items: center; font-family: 'Archivo', sans-serif; font-size: 10px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; padding: 3px 7px; border: 1px solid currentColor; }
.badge-r { color: #2d6a4f; background: #e8f5ef; }
.badge-e { color: #b8431a; background: #f4dccc; }

/* tabla de equipos (formulario) */
.eq-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; }
.eq-table { border: 1px solid var(--rule); background: #fff; min-width: 540px; width: 100%; }
.eq-head, .eq-row { display: grid; grid-template-columns: 36px 1.2fr .95fr .95fr .95fr 1.8fr 36px; min-width: 540px; }
.eq-head { background: var(--paper-2); border-bottom: 1px solid var(--rule); }
.eq-head > div { padding: 10px; border-right: 1px solid var(--rule); font-family: 'Archivo', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-soft); }
.eq-head > div:last-child { border-right: 0; }
.eq-row { border-bottom: 1px solid var(--rule-soft); }
.eq-row:last-child { border-bottom: 0; }
.eq-row > * { border-right: 1px solid var(--rule-soft); }
.eq-row > *:last-child { border-right: 0; }
.eq-field { display: flex; align-items: stretch; }
.eq-field input { width: 100%; border: 0; background: transparent; padding: 9px 10px; font-size: 13px; outline: none; font-family: inherit; }
.eq-field input.mono { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; }
.eq-field input:focus { background: var(--accent-soft); }
.eq-num { display: flex; align-items: center; justify-content: center; background: var(--paper-2); font-size: 12px; font-weight: 600; color: var(--muted); }
.eq-rep-cell { padding: 9px 10px; cursor: pointer; display: flex; align-items: center; transition: background .1s; user-select: none; gap: 6px; }
.eq-rep-cell:hover { background: var(--accent-soft); }
.rep-hint  { font-size: 11.5px; color: var(--muted); font-style: italic; }
.rep-count { font-size: 12px; }
.rep-amt   { font-size: 11.5px; font-weight: 600; color: var(--accent); font-family: 'IBM Plex Mono', monospace; }
.eq-del { display: flex; align-items: center; justify-content: center; background: var(--paper); }
.eq-del button { background: transparent; border: 0; cursor: pointer; color: var(--muted); padding: 8px; display: flex; }
.eq-del button:hover { color: var(--danger); }
.eq-del button:disabled { opacity: .25; cursor: not-allowed; }

/* modal */
#modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 1000; }
#modal-box { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); background: #fff; width: calc(100% - 32px); max-width: 720px; max-height: 90vh; display: flex; flex-direction: column; border: 2px solid var(--ink); z-index: 1001; }
.modal-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.modal-body { overflow-y: auto; flex: 1; }
.modal-foot { padding: 14px 20px; border-top: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
.rep-header { display: grid; grid-template-columns: 1fr .6fr .55fr 36px; background: var(--paper-2); border-bottom: 1px solid var(--rule); border-top: 1px solid var(--rule); }
.rep-header > div { padding: 8px 10px; font-family: 'Archivo', sans-serif; font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-soft); }
.rep-row { display: grid; grid-template-columns: 1fr .6fr .55fr 36px; border-bottom: 1px solid var(--rule-soft); }
.rep-row:last-child { border-bottom: 0; }
.rep-row input { border: 0; border-right: 1px solid var(--rule-soft); padding: 9px 10px; font-size: 13px; width: 100%; outline: none; background: transparent; }
.rep-row input:focus { background: var(--accent-soft); }
.rep-row input.mono { font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; }
.rep-del-cell { display: flex; align-items: center; justify-content: center; }
.rep-del-cell button { background: transparent; border: 0; cursor: pointer; color: var(--muted); padding: 8px; display: flex; }
.rep-del-cell button:hover { color: var(--danger); }

.toggle-wrap { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
.toggle-wrap input[type=checkbox] { display: none; }
.toggle-sw { width: 40px; height: 24px; background: var(--rule); border-radius: 12px; position: relative; transition: background .2s; flex-shrink: 0; }
.toggle-sw::after { content: ''; position: absolute; width: 18px; height: 18px; background: #fff; border-radius: 50%; top: 3px; left: 3px; transition: left .2s; }
.toggle-wrap input:checked + .toggle-sw { background: var(--ink); }
.toggle-wrap input:checked + .toggle-sw::after { left: 19px; }

/* documento imprimible */
.doc { background: #fff; border: 1px solid var(--rule); padding: 40px 48px; max-width: 900px; margin: 0 auto; }
.doc-empresa-head { display: grid; grid-template-columns: 1fr auto 1fr; gap: 24px; padding-bottom: 18px; border-bottom: 2px solid var(--ink); margin-bottom: 20px; align-items: center; }
.doc-empresa-name { font-family: 'Archivo', sans-serif; font-size: 26px; font-weight: 800; line-height: 1; margin-bottom: 4px; }
.doc-empresa-sub  { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-family: 'Archivo', sans-serif; font-weight: 600; margin-bottom: 8px; }
.doc-empresa-data { font-size: 12px; line-height: 1.75; color: var(--ink-soft); }
.doc-presupuesto  { text-align: center; }
.doc-presupuesto-title { font-family: 'Archivo', sans-serif; font-size: 17px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; color: var(--ink); border: 2px solid var(--ink); padding: 8px 16px; display: inline-block; }
.doc-title-block  { text-align: right; }
.doc-title  { font-family: 'Archivo', sans-serif; font-size: 34px; font-weight: 800; letter-spacing: -.02em; line-height: .9; color: var(--accent); }
.doc-numero { font-family: 'IBM Plex Mono', monospace; font-size: 20px; font-weight: 600; }
.doc-meta-grid { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12px; margin-top: 6px; text-align: right; }
.doc-meta-grid .lbl { font-family: 'Archivo', sans-serif; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.doc-meta-grid .val { font-weight: 500; }
.doc-client-block { margin-bottom: 18px; padding: 12px 14px; border: 1px solid var(--rule); background: var(--paper-2); }
.doc-client-block .lbl { font-family: 'Archivo', sans-serif; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: 4px; }
.doc-client-name  { font-size: 15px; font-weight: 600; font-family: 'Archivo', sans-serif; margin-bottom: 3px; }
.doc-client-data  { font-size: 12px; color: var(--ink-soft); line-height: 1.6; }

/* tabla del documento — solo bordes horizontales, sin recuadros */
.doc-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; position: relative; width: 100%; }
.doc-table { width: 100%; min-width: 520px; border-collapse: collapse; font-size: 11.5px; margin-bottom: 16px; border-top: 2px solid var(--ink); }
.doc-table th { background: var(--ink); color: var(--paper); border: 0; padding: 8px 10px; text-align: left; font-family: 'Archivo', sans-serif; font-size: 9.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.doc-table th:first-child { text-align: center; }
.doc-table td { border: 0; border-bottom: 1px solid var(--rule); padding: 8px 10px; vertical-align: top; }
.doc-table tbody tr:last-child td { border-bottom: 2px solid var(--ink); }
.doc-table td.num   { font-family: 'IBM Plex Mono', monospace; width: 32px; text-align: center; font-weight: 700; color: var(--muted); }
.doc-table td.mono  { font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
.doc-table td.right { text-align: right; font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
.rep-print-list { margin: 0; padding: 0; list-style: none; }
.rep-print-list li { font-size: 11px; padding: 1px 0; display: flex; gap: 6px; align-items: baseline; }
.rep-print-list .rp-desc  { flex: 1; }
.rep-print-list .rp-cod   { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); }
.rep-print-list .rp-price { font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; font-weight: 500; white-space: nowrap; }

.totals-block { border-top: 2px solid var(--ink); width: 280px; margin-left: auto; margin-bottom: 16px; }
.totals-block .t-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--rule-soft); font-size: 13px; }
.totals-block .t-row:last-child { border-bottom: 0; border-top: 2px solid var(--ink); padding-top: 10px; margin-top: 4px; font-family: 'Archivo', sans-serif; font-weight: 700; font-size: 16px; }
.totals-block .t-val { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
.doc-obs { margin-bottom: 16px; font-size: 12px; border-left: 3px solid var(--rule); padding-left: 10px; white-space: pre-wrap; color: var(--ink-soft); }
.doc-firmas { display: grid; grid-template-columns: 1fr 1fr; gap: 64px; margin-top: 36px; }
.doc-firmas > div { border-top: 1px solid var(--ink); padding-top: 5px; font-size: 10.5px; font-family: 'Archivo', sans-serif; letter-spacing: .08em; text-transform: uppercase; text-align: center; color: var(--ink-soft); }

.toast { position: fixed; top: 16px; right: 16px; padding: 10px 16px; background: var(--ink); color: #fff; font-family: 'Archivo', sans-serif; font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; z-index: 9999; display: flex; align-items: center; gap: 8px; }
.toast.err { background: var(--danger); }

/* ═══════════════════════════════════════════════════════
   RESPONSIVE MÓVIL — un solo bloque limpio
═══════════════════════════════════════════════════════ */

/* ── lista de equipos en el documento (detalle/impresión) ── */
.eq-list-wrap {
  border-top: 2px solid var(--ink);
  margin-bottom: 16px;
}
.eq-list-head, .eq-list-row {
  display: grid;
  grid-template-columns: 28px 90px 140px 1fr 88px;
  gap: 0 12px;
  align-items: start;
  padding: 8px 10px;
}
.eq-list-head {
  background: var(--ink); color: var(--paper);
  font-family: 'Archivo', sans-serif;
  font-size: 9.5px; font-weight: 700;
  letter-spacing: .1em; text-transform: uppercase;
}
.eq-list-head .eql-total { text-align: right; }
.eq-list-row { border-bottom: 1px solid var(--rule); }
.eq-list-row:last-child { border-bottom: 2px solid var(--ink); }
.eql-n {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 11px; font-weight: 700; color: var(--muted);
  padding-top: 1px;
}
.eql-id {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 12.5px; font-weight: 600;
}
.eql-desc { font-size: 12px; color: var(--ink-soft); line-height: 1.4; }
.eql-rep  { font-size: 12px; line-height: 1.5; }
.eql-total {
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px; font-weight: 600; text-align: right;
}

@media (max-width: 680px) {
  /* ── lista equipos en mobile: ficha técnica sin bordes internos ── */
  .eq-list-wrap { border-top: 2px solid var(--ink); }
  .eq-list-head { display: none; }
  .eq-list-row {
    display: grid;
    grid-template-columns: 26px 1fr auto;
    grid-template-rows: auto auto auto;
    grid-template-areas:
      "num id  total"
      ".   desc desc"
      ".   rep  rep";
    gap: 2px 8px;
    padding: 10px 0;
    /* UN SOLO separador delgado entre equipos, sin bordes internos */
    border-bottom: 1px solid var(--rule-soft);
  }
  .eq-list-row:last-child { border-bottom: 1px solid var(--ink); }
  .eql-n     { grid-area: num;   font-size: 10px; padding-top: 3px; color: var(--muted); font-weight: 700; }
  .eql-id    { grid-area: id;    font-size: 14px; font-weight: 600; }
  .eql-total { grid-area: total; font-size: 14px; font-weight: 700; text-align: right; }
  .eql-desc  { grid-area: desc;  font-size: 11.5px; color: var(--ink-soft); margin-top: 2px; }
  .eql-rep   { grid-area: rep;   font-size: 12px; margin-top: 4px; }

  .container { padding: 14px 12px; overflow-x: visible; }
  h1.display { font-size: 32px; }
  #searchInput { padding-left: 44px !important; font-size: 16px; }
  input, textarea, select { font-size: 16px; }
  .field { padding: 10px 12px; font-size: 16px; }
  .btn    { min-height: 48px; }
  .btn-sm { min-height: 40px; }
  .btn-icon { min-height: 48px; min-width: 48px; justify-content: center; }
  .toolbar { gap: 6px; }
  .remito-card { padding: 12px 10px; }
  .grid-card { grid-template-columns: 60px 1fr auto; gap: 8px; }
  .grid-card .display.mono { font-size: 15px; }
  .badge { font-size: 9px; padding: 2px 5px; }
  .form-toolbar-top { flex-wrap: wrap; row-gap: 8px; }
  .form-toolbar-top .btn { flex: 1; justify-content: center; }
  .btn-danger.form-delete { width: 100%; justify-content: center; order: 10; margin-top: 4px; }
  .grid-doc   { grid-template-columns: 1fr; }
  .grid-cli-3 { grid-template-columns: 1fr; }
  .grid-cli-2 { grid-template-columns: 1fr; }
  .eq-row input  { font-size: 16px; min-height: 48px; }
  .eq-rep-cell   { min-height: 48px; font-size: 14px; }
  .eq-del button { padding: 12px; }
  .eq-head, .eq-row { display: grid !important; min-width: 540px !important; }
  #modal-box { width: calc(100% - 16px); max-height: 90vh; }
  .modal-head { padding: 14px 16px 12px; }
  .modal-foot { padding: 12px 16px; flex-wrap: wrap; gap: 10px; }
  .rep-header { display: none; }
  .rep-row { display: grid; grid-template-columns: 1fr 1fr 44px; grid-template-rows: auto auto; grid-template-areas: "desc desc desc" "cod price del"; }
  .rep-row input[data-rf="descripcion"] { grid-area: desc; border-right: 0; border-bottom: 1px solid var(--rule-soft); font-size: 16px; min-height: 52px; padding: 12px; }
  .rep-row input[data-rf="codigo"]  { grid-area: cod;   font-size: 16px; min-height: 48px; border-right: 1px solid var(--rule-soft); }
  .rep-row input[data-rf="precio"]  { grid-area: price; font-size: 16px; min-height: 48px; }
  .rep-row .rep-del-cell { grid-area: del; border-left: 1px solid var(--rule-soft); }
  .rep-row .rep-del-cell button { padding: 14px; }
  #modal-total { font-size: 22px; }
  .toggle-wrap span:last-child { font-size: 12px; }
  .doc { padding: 16px 12px; border: 0; overflow-x: visible; }
  .doc-empresa-head { grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; gap: 0; padding-bottom: 14px; }
  .doc-empresa-head > div:nth-child(1) { grid-row: 2; grid-column: 1; padding: 10px 10px 0 0; border-right: 1px solid var(--rule); }
  .doc-empresa-head > .doc-presupuesto { grid-row: 1; grid-column: 1 / -1; background: var(--ink); padding: 10px; text-align: center; margin-bottom: 10px; }
  .doc-presupuesto-title { color: #fff; border: 0; padding: 0; font-size: 13px; letter-spacing: .22em; display: inline; }
  .doc-empresa-head > .doc-title-block { grid-row: 2; grid-column: 2; padding: 10px 0 0 10px; text-align: right; }
  .doc-empresa-name { font-size: 14px; margin-bottom: 2px; }
  .doc-empresa-sub  { font-size: 9px; margin-bottom: 3px; }
  .doc-empresa-data { font-size: 10px; line-height: 1.6; }
  .doc-title  { font-size: 20px; }
  .doc-numero { font-size: 14px; }
  .doc-meta-grid { font-size: 10px; gap: 2px 6px; }
  .doc-meta-grid .lbl { font-size: 9px; }
  .doc-client-block { padding: 10px 12px; }
  .doc-client-name  { font-size: 13px; }
  .doc-client-data  { font-size: 11px; line-height: 1.7; }
  .totals-block { width: 100%; }
  .doc-firmas { grid-template-columns: 1fr; gap: 24px; }
}

/* ═══════════════════════════════════════════════════════
   IMPRESIÓN A4
═══════════════════════════════════════════════════════ */


  .doc-table { min-width: unset; width: 100%; border-top: 2px solid var(--ink); }
  .doc-table thead { display: none; }
  .doc-table tbody tr {
    display: grid;
    grid-template-columns: 32px 1fr auto;
    grid-template-rows: auto auto auto;
    column-gap: 8px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--rule);
    border-top: 0; margin: 0;
  }
  .doc-table tbody tr:last-child { border-bottom: 2px solid var(--ink); }
  .doc-table td { display: block; border: 0; padding: 0; background: transparent !important; }
  /* num → col 1, row 1 */
  .doc-table td.num {
    grid-column: 1; grid-row: 1;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px; font-weight: 700; color: var(--muted);
    padding-top: 2px;
  }
  /* id → col 2, row 1 */
  .doc-table td.mono {
    grid-column: 2; grid-row: 1;
    font-size: 13px; font-weight: 600;
  }
  /* total → col 3, row 1 */
  .doc-table td.right {
    grid-column: 3; grid-row: 1;
    text-align: right; font-size: 14px; font-weight: 700;
    font-family: 'IBM Plex Mono', monospace;
  }
  /* descripcion → span 3 cols, row 2 */
  .doc-table td:nth-child(3) {
    grid-column: 1 / -1; grid-row: 2;
    font-size: 11.5px; color: var(--ink-soft);
    padding: 2px 0 0 0;
  }

/* === UTILS === */

const parsePrecio=v=>Math.max(0,parseFloat(String(v).replace(',','.'))||0);

const fmtMoney=n=>'$ '+(parseFloat(n)||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});

/* === ESTADO === */

const modalSt={eqIdx:-1};

/* === STORAGE === */

const DEMO_DATA=(()=>{const n=new Date().toISOString();return[

{id:'demo_3',numero:'0003',fechaRecibido:'2025-06-01',fechaEntregado:'2025-06-05',cliente:{nombre:'Juan Carlos Medina',telefono:'2804477890',email:'jcmedina@gmail.com',cuit:'20-28456789-3',domicilio:'San Martin 1120, Trelew'},observaciones:'Particular. Pago en efectivo al retirar.',hideRepDetail:false,equipos:[{id:'MED-001',marca:'Black & Decker',modelo:'KR5010',tipo:'Taladro percutor',repuestos:[{descripcion:'Cable de alimentacion 1.5m',codigo:'BD-CBL-15',precio:'1100'},{descripcion:'Porta broca 10mm',codigo:'BD-PBR-10',precio:'750'}]}],createdAt:n,updatedAt:n},
{id:'demo_4',numero:'0004',fechaRecibido:'2025-06-03',fechaEntregado:'',cliente:{nombre:'Municipalidad de Trelew',telefono:'2804480000',email:'mantenimiento@trelew.gob.ar',cuit:'30-59876543-2',domicilio:'Belgrano 330, Trelew'},observaciones:'Requiere remito oficial firmado. Llamar antes de entregar.',hideRepDetail:false,equipos:[{id:'MUN-014',marca:'Hilti',modelo:'TE 30',tipo:'Rotomartillo profesional',repuestos:[{descripcion:'Juego de carbones',codigo:'HLT-CRB-30',precio:'2200'},{descripcion:'Amortiguador delantero',codigo:'HLT-AMT-01',precio:'3100'},{descripcion:'Empaque de sellado',codigo:'HLT-EMP-T3',precio:'580'}]},{id:'MUN-015',marca:'Hilti',modelo:'AG 125',tipo:'Amoladora',repuestos:[{descripcion:'Engranaje conico',codigo:'HLT-ENG-AG',precio:'4800'}]},{id:'MUN-016',marca:'Bosch',modelo:'GSB 13 RE',tipo:'Taladro percutor',repuestos:[{descripcion:'Interruptor de velocidad',codigo:'BSH-INT-13',precio:'1650'},{descripcion:'Cojinete delantero',codigo:'BSH-COJ-F1',precio:'890'}]}],createdAt:n,updatedAt:n},

function loadAll(){try{const d=localStorage.getItem(STORAGE_KEY);state.remitos=d?JSON.parse(d):[]; }catch(e){state.remitos=[];}if(state.remitos.length===0){state.remitos=DEMO_DATA;try{localStorage.setItem(STORAGE_KEY,JSON.stringify(state.remitos));}catch(e){}}sortRemitos();}
function sortRemitos(){state.remitos.sort((a,b)=>(b.fechaRecibido||'').localeCompare(a.fechaRecibido||'')||(b.createdAt||'').localeCompare(a.createdAt||''));}
function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state.remitos));}

/* === CRUD === */
function saveRemito(r){
  if(!r.numero?.trim()){toast('Falta el numero de remito','err');return false;}
  if(!r.equipos||r.equipos.length<1){toast('Agrega al menos 1 equipo','err');return false;}
  const now=new Date().toISOString();
  r.updatedAt=now;r.createdAt=r.createdAt||now;
  const i=state.remitos.findIndex(x=>x.id===r.id);
  if(i>=0)state.remitos[i]=r;else state.remitos.push(r);
  sortRemitos();persist();state.current=r;state.view='detail';state.deleteStep=false;render();toast('Guardado');return true;
}
function deleteRemito(id){state.remitos=state.remitos.filter(x=>x.id!==id);persist();state.view='list';state.current=null;render();toast('Eliminado');}
function duplicateRemito(r){
  const copy=JSON.parse(JSON.stringify(r));
  copy.id=makeId();copy.numero='';copy.fechaRecibido='';copy.fechaEntregado='';
  copy.equipos=[emptyEquipo()];
  delete copy.createdAt;delete copy.updatedAt;
  state.current=copy;state.view='form';render();
}

/* === NAV === */
function goList(){state.view='list';state.current=null;state.deleteStep=false;render();}
function goNew(){
  state.current={id:makeId(),numero:'',fechaRecibido:new Date().toISOString().slice(0,10),fechaEntregado:'',

    observaciones:'',hideRepDetail:false,equipos:[emptyEquipo()]};
  state.view='form';render();
}
function goEdit(id){const r=state.remitos.find(x=>x.id===id);if(!r)return;state.current=JSON.parse(JSON.stringify(r));state.view='form';state.deleteStep=false;render();}

/* === TOAST === */
let toastTmr=null;
function toast(msg,kind='ok'){document.querySelectorAll('.toast').forEach(e=>e.remove());const el=document.createElement('div');el.className='toast'+(kind==='err'?' err':'');el.textContent=msg;document.body.appendChild(el);clearTimeout(toastTmr);toastTmr=setTimeout(()=>el.remove(),2400);}

/* === MODAL === */
function openModal(eqIdx){
  collectFormData();modalSt.eqIdx=eqIdx;
  const eq=state.current.equipos[eqIdx];
  document.getElementById('modal-subtitle').textContent='Equipo '+(eqIdx+1)+' -- '+([eq.marca,eq.modelo].filter(Boolean).join(' ')||'Sin datos');
  document.getElementById('modal-title').textContent=eq.id?'ID: '+eq.id:'Repuestos';
  renderModalRows();document.getElementById('modal').style.display='flex';document.body.style.overflow='hidden';
}
function closeModal(){document.getElementById('modal').style.display='none';document.body.style.overflow='';if(state.view==='form'){render();}}
function renderModalRows(){
  const eq=state.current.equipos[modalSt.eqIdx];
  const reps=eq.repuestos||[];
  const html=reps.map((r,i)=>`<div class="rep-row" data-ri="${i}"><input data-ri="${i}" data-rf="descripcion" placeholder="Descripcion del repuesto" value="${esc(r.descripcion)}"><input data-ri="${i}" data-rf="codigo" class="mono" placeholder="Codigo" value="${esc(r.codigo)}"><input data-ri="${i}" data-rf="precio" class="mono" type="number" min="0" step="0.01" placeholder="0.00" value="${esc(r.precio)}"><div class="rep-del rep-del-cell"><button data-ri="${i}" data-ract="del" title="Quitar">${I.trash}</button></div></div>`).join('');
  document.getElementById('modal-rows').innerHTML=html||'<div style="padding:16px 20px;color:var(--muted);font-size:13px;font-style:italic">Sin repuestos -- usa el boton para agregar.</div>';
  document.querySelectorAll('#modal-rows input[data-ri]').forEach(el=>{
    el.addEventListener('input',()=>{
      const i=parseInt(el.getAttribute('data-ri'),10);
      const f=el.getAttribute('data-rf');
      state.current.equipos[modalSt.eqIdx].repuestos[i][f]=el.value;
      updateModalTotal();
    });
  });
  document.querySelectorAll('[data-ract="del"]').forEach(el=>{
    el.addEventListener('click',()=>{
      const i=parseInt(el.getAttribute('data-ri'),10);
      state.current.equipos[modalSt.eqIdx].repuestos.splice(i,1);
      renderModalRows();updateModalTotal();
    });
  });
  updateModalTotal();
}
function updateModalTotal(){const t=totalEquipo(state.current.equipos[modalSt.eqIdx]);document.getElementById('modal-total').textContent=fmtMoney(t);}

/* === COLLECT FORM DATA === */
function collectFormData(){
  if(state.view!=='form'||!state.current)return;
  ['numero','fechaRecibido','fechaEntregado','observaciones'].forEach(f=>{const el=document.querySelector('[data-f="'+f+'"]');if(el)state.current[f]=el.value;});
  const hrd=document.getElementById('hideRepDetail');if(hrd)state.current.hideRepDetail=hrd.checked;
  ['nombre','telefono','email','cuit','domicilio'].forEach(f=>{const el=document.querySelector('[data-cf="'+f+'"]');if(el)state.current.cliente[f]=el.value;});
  document.querySelectorAll('[data-eq][data-ef]').forEach(el=>{const i=parseInt(el.getAttribute('data-eq'),10);const f=el.getAttribute('data-ef');if(state.current.equipos[i])state.current.equipos[i][f]=el.value;});
}

/* === FILE I/O === */
async function exportData(){
  const payload=JSON.stringify({exportedAt:new Date().toISOString(),remitos:state.remitos},null,2);
  if('showSaveFilePicker' in window){
    try{const h=await window.showSaveFilePicker({suggestedName:'remitos-'+new Date().toISOString().slice(0,10)+'.json',types:[{description:'JSON',accept:{'application/json':['.json']}}]});const w=await h.createWritable();await w.write(payload);await w.close();toast('Exportado');}
    catch(e){if(e.name!=='AbortError')fallbackDownload(payload);}
  }else{fallbackDownload(payload);}
}
function fallbackDownload(payload){
  if(!payload)payload=JSON.stringify({exportedAt:new Date().toISOString(),remitos:state.remitos},null,2);
  const blob=new Blob([payload],{type:'application/json'});const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='remitos-'+new Date().toISOString().slice(0,10)+'.json';
  document.body.appendChild(a);a.click();document.body.removeChild(a);setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('Exportados '+state.remitos.length+' remitos');
}
async function importData(){
  if('showOpenFilePicker' in window){
    try{const[h]=await window.showOpenFilePicker({types:[{accept:{'application/json':['.json']}}]});const file=await h.getFile();processImport(await file.text());}
    catch(e){if(e.name!=='AbortError')document.getElementById('fileInput').click();}
  }else{document.getElementById('fileInput').click();}
}
function processImport(text){
  try{const d=JSON.parse(text);const list=Array.isArray(d)?d:d.remitos;if(!Array.isArray(list))throw new Error('formato invalido');
    let n=0;list.forEach(r=>{if(!r.id)r.id=makeId();const i=state.remitos.findIndex(x=>x.id===r.id);if(i>=0)state.remitos[i]=r;else state.remitos.push(r);n++;});
    sortRemitos();persist();render();toast('Importados '+n+' remitos');
  }catch(e){toast('Error al importar: '+e.message,'err');}
}

/* ============================================
   RENDER
   ============================================ */
function render(){
  document.getElementById('app').innerHTML=state.view==='list'?renderList():state.view==='form'?renderForm():renderDetail();
  attachHandlers();
}

/* --- LISTA --- */
function renderList(){
  const q=(state.search||'').toLowerCase().trim();
  const filtered=!q?state.remitos:state.remitos.filter(r=>{
    const h=(r.numero||'').toLowerCase().includes(q)||(r.cliente?.nombre||'').toLowerCase().includes(q);
    const e=(r.equipos||[]).some(eq=>(eq.id||'').toLowerCase().includes(q)||(eq.marca||'').toLowerCase().includes(q)||(eq.modelo||'').toLowerCase().includes(q)||(eq.tipo||'').toLowerCase().includes(q));
    return h||e;
  });
  const cards=filtered.map(r=>{
    const total=totalRemito(r);
    return '<div class="remito-card" data-action="view" data-id="'+esc(r.id)+'">'
      +'<div class="grid-card">'
      +'<div style="min-width:90px"><div class="label-tiny">N</div><div class="display mono" style="font-size:20px">'+esc(r.numero||'--')+'</div></div>'
      +'<div>'
      +'<div style="font-size:14px;font-weight:600;margin-bottom:5px">'+(r.cliente?.nombre?esc(r.cliente.nombre):'<span style="color:var(--muted);font-style:italic">Sin cliente</span>')+'</div>'
      +'<div style="display:flex;gap:14px;flex-wrap:wrap">'
      +'<div><span class="badge badge-r">Recibido</span> <span class="mono" style="font-size:12px">'+esc(fmtDate(r.fechaRecibido))+'</span></div>'
      +'<div><span class="badge badge-e">Entrega</span> <span class="mono" style="font-size:12px">'+(r.fechaEntregado?esc(fmtDate(r.fechaEntregado)):'<span style="color:var(--muted)">Pendiente</span>')+'</span></div>'
      +'<div><span class="label-tiny">'+(r.equipos||[]).length+' equipo'+(((r.equipos||[]).length!==1)?'s':'')+'</span>'+(total>0?' <span class="mono" style="font-size:12px;font-weight:600;margin-left:4px">'+esc(fmtMoney(total))+'</span>':'')+'</div>'
      +'</div></div>'
      +'<div class="toolbar" data-stop="1"><button class="btn btn-icon" data-action="edit" data-id="'+esc(r.id)+'" title="Editar">'+I.edit+'</button></div>'
      +'</div></div>';
  }).join('');
  const empty='<div style="text-align:center;padding:80px;border:2px dashed var(--rule);color:var(--muted)">'+I.pkg+'<div class="display" style="font-size:20px;color:var(--ink);margin-bottom:4px">'+(state.remitos.length===0?'Sin remitos todavia':'Sin resultados')+'</div><div style="font-size:13px">'+(state.remitos.length===0?'Crea el primero con el boton.':'Proba con otro termino.')+'</div></div>';
  return '<div class="container">'
    +'<div style="margin-bottom:32px;display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:16px">'
    +'<div><div class="label-tiny" style="margin-bottom:6px">Sistema de gestion</div><h1 class="display" style="font-size:52px;margin:0;line-height:.95">REMITOS<span style="color:var(--accent)">.</span></h1><div style="font-size:13px;color:var(--muted);margin-top:6px">'+state.remitos.length+' '+(state.remitos.length===1?'remito guardado':'remitos guardados')+'</div></div>'
    +'<div class="toolbar"><button class="btn btn-icon" data-action="import" title="Importar JSON">'+I.up+'</button><button class="btn btn-icon" data-action="export" title="Exportar JSON">'+I.down+'</button><button class="btn" data-action="new">'+I.plus+' Nuevo remito</button></div>'
    +'</div>'
    +'<div style="position:relative;margin-bottom:24px"><span style="position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex">'+I.srch+'</span><input class="field" id="searchInput" placeholder="Buscar por N de remito, cliente, ID de equipo, marca..." value="'+esc(state.search)+'" style="padding:12px 14px 12px 40px;font-size:14px"></div>'
    +(filtered.length===0?empty:'<div style="display:grid;gap:12px">'+cards+'</div>')
    +'</div>';
}

/* --- FORM --- */
function renderForm(){
  const r=state.current;
  const isEdit=!!r.createdAt;
  const rows=r.equipos.map((eq,i)=>{
    const reps=eq.repuestos||[];const t=totalEquipo(eq);
    const repHtml=reps.length===0
      ?'<span class="rep-hint">Sin repuestos -- clic para agregar</span>'
      :'<span class="rep-summary"><span style="font-size:12px">'+reps.length+' repuesto'+(reps.length!==1?'s':'')+'</span><span class="mono" style="font-size:11.5px;color:var(--accent);font-weight:600">'+fmtMoney(t)+'</span></span>';
    return '<div class="eq-row">'
      +'<div class="eq-num mono">'+String(i+1).padStart(2,'0')+'</div>'
      +'<div class="eq-field" data-label="ID"><input class="mono" data-eq="'+i+'" data-ef="id" placeholder="A1234" value="'+esc(eq.id)+'"></div>'
      +'<div class="eq-field" data-label="Marca"><input data-eq="'+i+'" data-ef="marca" placeholder="Marca" value="'+esc(eq.marca)+'"></div>'
      +'<div class="eq-field" data-label="Modelo"><input data-eq="'+i+'" data-ef="modelo" placeholder="Modelo" value="'+esc(eq.modelo)+'"></div>'
      +'<div class="eq-field" data-label="Tipo"><input data-eq="'+i+'" data-ef="tipo" placeholder="Tipo" value="'+esc(eq.tipo)+'"></div>'
      +'<div class="eq-rep-cell" data-action="openModal" data-i="'+i+'">'+repHtml+'</div>'
      +'<div class="eq-del"><button data-action="removeEq" data-i="'+i+'"'+(r.equipos.length<=1?' disabled':'')+' title="Quitar fila">'+I.trash+'</button></div>'
      +'</div>';
  }).join('');
  return '<div class="container">'
    +'<div class="no-print form-toolbar-top" style="margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">'
    +'<button class="btn btn-ghost" data-action="back">'+I.back+' Volver</button>'
    +'<div class="toolbar">'+(isEdit?(state.deleteStep
  ?'<div style="display:flex;align-items:center;gap:8px;padding:6px 10px;background:#fde8e8;border:1px solid var(--danger)">'
    +'<span style="font-size:12px;font-weight:600;color:var(--danger);font-family:Archivo,sans-serif">Eliminar definitivamente?</span>'
    +'<button class="btn btn-sm btn-danger" data-action="doDelete" data-id="'+esc(r.id)+'">Si, eliminar</button>'
    +'<button class="btn btn-sm btn-ghost" data-action="cancelDelete">Cancelar</button>'
    +'</div>'
  :'<button class="btn btn-danger form-delete" data-action="askDelete">'+I.trash+' Eliminar remito</button>'
):'')+'<button class="btn btn-outline" data-action="back">'+I.x+' Cancelar</button><button class="btn" data-action="save">'+I.save+' Guardar</button></div>'
    +'</div>'
    +'<div style="margin-bottom:24px"><div class="label-tiny" style="margin-bottom:4px">'+(isEdit?'Editar':'Nuevo')+' remito</div><h2 class="display" style="font-size:36px;margin:0;line-height:1">'+(r.numero?'Remito N '+esc(r.numero):'Sin numerar')+'</h2></div>'
    +'<div class="card" style="padding:20px;margin-bottom:20px">'
    +'<div class="label-tiny" style="margin-bottom:12px;border-bottom:1px solid var(--rule-soft);padding-bottom:8px">Datos del documento</div>'
    +'<div class="grid-doc">'
    +'<div><label class="label-tiny" style="display:block;margin-bottom:5px">Numero *</label><input class="field mono" data-f="numero" placeholder="0001" value="'+esc(r.numero)+'"></div>'
    +'<div><label class="label-tiny" style="display:block;margin-bottom:5px">Fecha de Recibido</label><input class="field mono" type="date" data-f="fechaRecibido" value="'+esc(r.fechaRecibido)+'"></div>'
    +'<div><label class="label-tiny" style="display:block;margin-bottom:5px">Fecha de entrega</label><input class="field mono" type="date" data-f="fechaEntregado" value="'+esc(r.fechaEntregado)+'"></div>'
    +'<div style="display:flex;align-items:flex-end;padding-bottom:2px"><label class="toggle-wrap"><input type="checkbox" id="hideRepDetail"'+(r.hideRepDetail?' checked':'')+'>  <span class="toggle-sw"></span><span style="font-size:12px;color:var(--ink-soft);line-height:1.3">Ocultar desglose<br>en impresion</span></label></div>'
    +'</div>'
    +'<div><label class="label-tiny" style="display:block;margin-bottom:5px">Observaciones</label><textarea class="field" data-f="observaciones" rows="2" placeholder="Notas adicionales...">'+esc(r.observaciones)+'</textarea></div>'
    +'</div>'
    +'<div class="card" style="padding:20px;margin-bottom:20px">'
    +'<div class="label-tiny" style="margin-bottom:12px;border-bottom:1px solid var(--rule-soft);padding-bottom:8px">Datos del cliente</div>'
    +'<div class="grid-cli-3">'
    +'<div><label class="label-tiny" style="display:block;margin-bottom:5px">Nombre / Empresa</label><input class="field" data-cf="nombre" placeholder="Razon social o apellido" value="'+esc(r.cliente?.nombre||'')+'"></div>'
    +'<div><label class="label-tiny" style="display:block;margin-bottom:5px">CUIT</label><input class="field mono" data-cf="cuit" placeholder="20-12345678-9" value="'+esc(r.cliente?.cuit||'')+'"></div>'
    +'<div><label class="label-tiny" style="display:block;margin-bottom:5px">Telefono</label><input class="field mono" data-cf="telefono" placeholder="Telefono" value="'+esc(r.cliente?.telefono||'')+'"></div>'
    +'</div>'
    +'<div class="grid-cli-2">'
    +'<div><label class="label-tiny" style="display:block;margin-bottom:5px">Email</label><input class="field" data-cf="email" placeholder="correo@ejemplo.com" value="'+esc(r.cliente?.email||'')+'"></div>'
    +'<div><label class="label-tiny" style="display:block;margin-bottom:5px">Domicilio</label><input class="field" data-cf="domicilio" placeholder="Direccion completa" value="'+esc(r.cliente?.domicilio||'')+'"></div>'
    +'</div></div>'
    +'<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">'
    +'<h3 class="display" style="font-size:22px;margin:0">Equipos <span class="mono" style="color:var(--muted);font-size:16px">'+r.equipos.length+'</span></h3>'
    +'<button class="btn btn-sm btn-outline no-print" style="display:none" data-action="addEq">'+I.plus+'</button></div>'
    +'<div class="eq-table-wrap"><div class="eq-table"><div class="eq-head"><div>#</div><div>ID</div><div>Marca</div><div>Modelo</div><div>Tipo</div><div>Repuestos (clic para editar)</div><div></div></div>'+rows+'</div>'
    +'</div>'
    +'<button class="btn btn-add-equipo" data-action="addEq">'+I.plus+' Agregar equipo</button>'
    +'<div style="margin-top:8px;font-size:12px;color:var(--muted)">Minimo 1 equipo &middot; Sin limite maximo.</div>'
    +'</div>';
}

/* --- DETALLE --- */
function renderDetail(){
  const r=state.current;const hide=r.hideRepDetail;const grand=totalRemito(r);
  const eqRows=(r.equipos||[]).filter(eq=>eq.id||eq.marca||eq.modelo||eq.tipo||(eq.repuestos&&eq.repuestos.length)).map((eq,i)=>{
    const t=totalEquipo(eq);const reps=eq.repuestos||[];
    let repCell='';
    if(!hide){
      repCell=reps.length===0?'--':'<ul class="rep-print-list">'+reps.map(rep=>'<li><span class="rp-desc">'+esc(rep.descripcion||'--')+'</span>'+(rep.codigo?'<span class="rp-cod">['+esc(rep.codigo)+']</span>':'')+'<span class="rp-price">'+fmtMoney(parsePrecio(rep.precio))+'</span></li>').join('')+'</ul>';
    }else{
      repCell=reps.length===0?'--':'<ul class="rep-print-list">'+reps.map(rep=>'<li><span class="rp-desc">'+esc(rep.descripcion||'--')+'</span></li>').join('')+'</ul>';
    }
    var desc=([eq.marca,eq.modelo,eq.tipo].filter(Boolean).map(esc).join(' &middot; ')||'&mdash;');return '<div class="eq-list-row">'+'<span class="eql-n">'+String(i+1).padStart(2,'0')+'</span>'+'<span class="eql-id">'+esc(eq.id||'&mdash;')+'</span>'+'<span class="eql-desc">'+desc+'</span>'+'<span class="eql-rep">'+repCell+'</span>'+'<span class="eql-total">'+(t>0?fmtMoney(t):'&mdash;')+'</span>'+'</div>';
  }).join('');
  const clientBlock=(r.cliente?.nombre||r.cliente?.cuit||r.cliente?.telefono)
    ?'<div class="doc-client-block"><div class="lbl">Cliente</div><div class="doc-client-name">'+esc(r.cliente.nombre||'--')+'</div><div class="doc-client-data">'+[r.cliente.cuit?'CUIT: '+r.cliente.cuit:'',r.cliente.telefono?'Tel: '+r.cliente.telefono:'',r.cliente.email||'',r.cliente.domicilio||''].filter(Boolean).map(esc).join(' &nbsp;&middot;&nbsp; ')+'</div></div>'
    :'';
  return '<div class="container">'
    +'<div class="no-print detail-toolbar" style="margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;row-gap:8px">'
    +'<button class="btn btn-ghost" data-action="back">'+I.back+' Volver al listado</button>'
    +'<div class="toolbar"><label class="toggle-wrap" style="margin-right:8px"><input type="checkbox" id="toggleHide"'+(hide?' checked':'')+'><span class="toggle-sw"></span><span style="font-size:12px;color:var(--ink-soft)">Ocultar desglose</span></label>'
    +'<button class="btn btn-icon" data-action="duplicate" data-id="'+esc(r.id)+'" title="Duplicar remito">'+I.copy+'</button>'
    +'<button class="btn btn-outline" data-action="edit" data-id="'+esc(r.id)+'">'+I.edit+' Editar</button>'
    +'<button class="btn" data-action="print">'+I.print+' Imprimir</button></div>'
    +'</div>'
    +'<div class="doc">'
    +'<div class="doc-empresa-head">'
    +'<div><div class="doc-empresa-name">'+esc(EMPRESA.nombre)+'</div><div class="doc-empresa-sub">'+esc(EMPRESA.subtitulo)+'</div><div class="doc-empresa-data">'+esc(EMPRESA.direccion)+'<br>Tel: '+esc(EMPRESA.telefono)+'<br>'+esc(EMPRESA.email)+'<br>CUIT: '+esc(EMPRESA.cuit)+'</div></div>'
    
    +'<div class="doc-presupuesto"><div class="doc-presupuesto-title">PRESUPUESTO</div></div>'+'<div class="doc-title-block"><div class="doc-title">REMITO</div><div class="doc-numero">N '+esc(r.numero||'--')+'</div><div class="doc-meta-grid"><div class="lbl">Recibido</div><div class="val mono">'+esc(fmtDate(r.fechaRecibido))+'</div><div class="lbl">Entrega</div><div class="val mono">'+(r.fechaEntregado?esc(fmtDate(r.fechaEntregado)):'Pendiente')+'</div></div></div>'
    +'</div>'
    +clientBlock
    +'<div class="eq-list-wrap">'+'<div class="eq-list-head">'+'<span class="eql-n">#</span>'+'<span class="eql-id">ID / Equipo</span>'+'<span class="eql-desc">Descripcion</span>'+'<span class="eql-rep">Repuestos / Trabajo</span>'+'<span class="eql-total">Total</span>'+'</div>'+eqRows+'</div>'
    +'<div style="display:flex;justify-content:flex-end"><div class="totals-block"><div class="t-row"><span>Subtotal</span><span class="t-val">'+fmtMoney(grand)+'</span></div><div class="t-row"><span>TOTAL</span><span class="t-val">'+fmtMoney(grand)+'</span></div></div></div>'
    +(r.observaciones?'<div class="label-tiny" style="margin-bottom:5px">Observaciones</div><div class="doc-obs">'+esc(r.observaciones)+'</div>':'')
    +'<div class="doc-firmas"><div>Firma y aclaracion -- Entrega</div><div>Firma y aclaracion -- Recibe</div></div>'
    +'</div></div>';
}

/* === HANDLERS === */
function attachHandlers(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click',e=>{
      e.stopPropagation();
      const a=el.getAttribute('data-action');
      const id=el.getAttribute('data-id');
      const idx=parseInt(el.getAttribute('data-i')||'-1',10);
      if(a==='new')goNew();
      else if(a==='view')goDetail(id);
      else if(a==='edit')goEdit(id);
      else if(a==='back')goList();
      else if(a==='save'){collectFormData();saveRemito(state.current);}
      else if(a==='print')window.print();
      else if(a==='duplicate'){const r=state.remitos.find(x=>x.id===id);if(r)duplicateRemito(r);}
      else if(a==='export')exportData();
      else if(a==='import')importData();
      else if(a==='openModal')openModal(idx);
      else if(a==='addEq'){collectFormData();state.current.equipos.push(emptyEquipo());render();}
      else if(a==='removeEq'){collectFormData();if(state.current.equipos.length>1){state.current.equipos.splice(idx,1);render();}}
      else if(a==='askDelete'){state.deleteStep=true;collectFormData();render();}
      else if(a==='cancelDelete'){state.deleteStep=false;collectFormData();render();}
      else if(a==='doDelete'){deleteRemito(id);}
    });
  });
  document.querySelectorAll('[data-stop]').forEach(el=>el.addEventListener('click',e=>e.stopPropagation()));
  document.querySelectorAll('input[data-f],textarea[data-f]').forEach(el=>{el.addEventListener('input',()=>{if(!state.current)return;state.current[el.getAttribute('data-f')]=el.value;scheduleSave();});});
  const hrd=document.getElementById('hideRepDetail');if(hrd)hrd.addEventListener('change',()=>{if(state.current)state.current.hideRepDetail=hrd.checked;});
  document.querySelectorAll('input[data-cf]').forEach(el=>{el.addEventListener('input',()=>{if(!state.current?.cliente)return;state.current.cliente[el.getAttribute('data-cf')]=el.value;scheduleSave();});});
  document.querySelectorAll('input[data-eq][data-ef]').forEach(el=>{el.addEventListener('input',()=>{if(!state.current)return;const i=parseInt(el.getAttribute('data-eq'),10);if(state.current.equipos[i])state.current.equipos[i][el.getAttribute('data-ef')]=el.value;scheduleSave();});});
  const th=document.getElementById('toggleHide');
  if(th)th.addEventListener('change',()=>{
    if(!state.current)return;state.current.hideRepDetail=th.checked;
    const i=state.remitos.findIndex(x=>x.id===state.current.id);if(i>=0){state.remitos[i].hideRepDetail=th.checked;persist();}
    render();
  });
  const si=document.getElementById('searchInput');
  if(si){si.addEventListener('input',()=>{state.search=si.value;document.getElementById('app').innerHTML=renderList();attachHandlers();const s2=document.getElementById('searchInput');if(s2){s2.focus();s2.setSelectionRange(s2.value.length,s2.value.length);}});}
  const mc=document.getElementById('modal-close-btn');if(mc)mc.onclick=closeModal;
  const ma=document.getElementById('modal-add-btn');if(ma)ma.onclick=()=>{if(modalSt.eqIdx<0)return;state.current.equipos[modalSt.eqIdx].repuestos.push(emptyRep());renderModalRows();};
  document.getElementById('modal').onclick=e=>{if(e.target===document.getElementById('modal'))closeModal();};
}

/* === BOOT === */
document.getElementById('fileInput').addEventListener('change',e=>{const f=e.target.files?.[0];if(f){f.text().then(processImport);}e.target.value='';});
loadAll();render();


/* scroll al input cuando se abre el teclado en mobile */
document.addEventListener('focusin', function(e) {
  var el = e.target;
  if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
    setTimeout(function() {
      el.scrollIntoView({ behavior: 'smooth', block: 'center', inline: 'nearest' });
    }, 350);
  }
});


/* ─ ocultar UI al imprimir (refuerzo cross-browser) ─ */
function hideUI() {
  document.querySelectorAll('.no-print').forEach(function(el) {
    el.setAttribute('data-was', el.style.display || '');
    el.style.display = 'none';
  });
  document.querySelectorAll('.detail-toolbar').forEach(function(el) {
    el.style.display = 'none';
  });
}
function showUI() {
  document.querySelectorAll('.no-print').forEach(function(el) {
    el.style.display = el.getAttribute('data-was') || '';
  });
  document.querySelectorAll('.detail-toolbar').forEach(function(el) {
    el.style.display = '';
  });
}
if (window.matchMedia) {
  window.matchMedia('print').addEventListener('change', function(mq) {
    if (mq.matches) hideUI(); else showUI();
  });
}
window.onbeforeprint = hideUI;
window.onafterprint  = showUI;

</script>
