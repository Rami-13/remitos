<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SERVIMAC</title>
<script src="https://accounts.google.com/gsi/client" async></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ── VARIABLES ─────────────────────────────────────────────── */
:root{
  --paper:#f3efe6;--paper-2:#e9e3d5;--ink:#181613;--ink-soft:#4a4540;
  --muted:#8a8175;--rule:#cfc6b2;--rule-soft:#ddd5c2;
  --accent:#b8431a;--accent-soft:#f4dccc;--danger:#8b1c1c;--ok:#2d6a4f;
}

/* ── LOGIN ──────────────────────────────────────────────────── */
#loginScreen{display:none;position:fixed;inset:0;background:var(--paper);
  z-index:9999;flex-direction:column;align-items:center;justify-content:center;gap:24px}
#loginScreen.visible{display:flex}
#loginScreen h1{font-family:'Archivo',sans-serif;font-size:32px;font-weight:800;letter-spacing:.04em}
#loginScreen p{color:var(--muted);font-size:14px}
#loginDenied{display:none;color:var(--danger);font-size:14px;font-weight:600}

/* ── RESET ──────────────────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper);color:var(--ink);
  font-family:'IBM Plex Sans',sans-serif;font-size:15px;line-height:1.5}

/* ── LAYOUT ─────────────────────────────────────────────────── */
#app{max-width:900px;margin:0 auto;padding:0 16px 60px}

/* ── BUTTONS ────────────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  font-family:'Archivo',sans-serif;font-size:13px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;min-height:44px;
  padding:0 16px;border:2px solid var(--ink);background:var(--ink);
  color:var(--paper);cursor:pointer;transition:background .12s,color .12s,border-color .12s;
  text-decoration:none;-webkit-appearance:none}
.btn:hover{background:var(--ink-soft);border-color:var(--ink-soft)}
.btn-outline{background:transparent;color:var(--ink)}
.btn-outline:hover{background:var(--paper-2)}
.btn-accent{background:var(--accent);border-color:var(--accent)}
.btn-accent:hover{background:#9a3614;border-color:#9a3614}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-ok:hover{background:#245a40;border-color:#245a40}
.btn-danger{background:var(--danger);border-color:var(--danger)}
.btn-danger:hover{background:#6e1515;border-color:#6e1515}
.btn-sm{font-size:12px;min-height:36px;padding:0 12px}

/* ── TOOLBAR ────────────────────────────────────────────────── */
.toolbar{display:flex;align-items:center;gap:8px;padding:16px 0 12px;
  border-bottom:2px solid var(--ink);margin-bottom:20px;flex-wrap:wrap}
.toolbar-title{font-family:'Archivo',sans-serif;font-size:20px;font-weight:800;
  letter-spacing:.04em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── SEARCH ─────────────────────────────────────────────────── */
.search-wrap{margin-bottom:16px}
.search-wrap input{width:100%;padding:10px 12px;border:2px solid var(--rule);
  background:var(--paper);font-family:'IBM Plex Sans',sans-serif;
  font-size:16px;color:var(--ink)}
.search-wrap input:focus{outline:none;border-color:var(--ink)}

/* ── FILE STATUS ────────────────────────────────────────────── */
.file-status-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;
  font-size:13px;font-family:'IBM Plex Mono',monospace;flex-wrap:wrap}
.file-linked{color:var(--ok);font-weight:600}

/* ── LIST TABLE ─────────────────────────────────────────────── */
.list-table{width:100%;border-collapse:collapse}
.list-table th{font-family:'Archivo',sans-serif;font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;background:var(--paper-2);border-bottom:2px solid var(--ink);
  padding:8px 10px;text-align:left}
.list-table td{padding:10px;border-bottom:1px solid var(--rule);font-size:14px;vertical-align:middle}
.list-table tr:hover td{background:var(--paper-2)}
.mono{font-family:'IBM Plex Mono',monospace}
.badge-pend{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--accent);font-weight:600;letter-spacing:.05em}
.row-actions{display:flex;gap:6px}

/* ── EMPTY STATE ────────────────────────────────────────────── */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state p{font-family:'Archivo',sans-serif;font-size:15px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;margin-bottom:16px}

/* ── FORM SECTIONS ──────────────────────────────────────────── */
.form-section{border:2px solid var(--rule);margin-bottom:20px}
.form-section-title{font-family:'Archivo',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;background:var(--paper-2);
  border-bottom:2px solid var(--rule);padding:8px 12px;color:var(--ink-soft)}
.form-section-body{padding:14px 12px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.span-2{grid-column:span 2}

.field{display:flex;flex-direction:column;gap:4px}
.field label{font-family:'Archivo',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.field input,.field textarea,.field select{padding:9px 10px;border:2px solid var(--rule);
  background:var(--paper);font-family:'IBM Plex Sans',sans-serif;
  font-size:16px;color:var(--ink);width:100%;-webkit-appearance:none}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--ink)}
.field-mono input,.field-mono textarea{font-family:'IBM Plex Mono',monospace}
.field textarea{resize:vertical;min-height:80px}

.toggle-row{display:flex;align-items:center;gap:10px;padding:8px 0}
.toggle-label{font-family:'Archivo',sans-serif;font-size:12px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);cursor:pointer}
input[type="checkbox"]{width:20px;height:20px;cursor:pointer;accent-color:var(--ink);flex-shrink:0}

/* ── EQUIPMENT TABLE (CSS Grid) ─────────────────────────────── */
.eq-table-wrap{overflow-x:auto;overscroll-behavior-x:contain}
.eq-row{display:grid;grid-template-columns:36px 1.2fr .95fr .95fr .95fr 1.8fr 44px;
  min-width:540px;align-items:center}
.eq-head-row{background:var(--paper-2);border-bottom:2px solid var(--ink)}
.eq-head-cell{font-family:'Archivo',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);padding:7px 6px}
.eq-cell{padding:3px 3px;border-bottom:1px solid var(--rule-soft)}
.eq-cell input{width:100%;padding:7px 6px;border:1px solid var(--rule-soft);
  background:transparent;font-family:'IBM Plex Sans',sans-serif;
  font-size:14px;color:var(--ink)}
.eq-cell input:focus{outline:none;border-color:var(--ink);background:#fff}
.eq-num{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted);padding:0 4px}
.eq-rep-btn{width:100%;padding:7px 8px;border:1px dashed var(--rule);background:transparent;
  font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);
  cursor:pointer;text-align:left;min-height:36px;-webkit-appearance:none}
.eq-rep-btn:hover{border-color:var(--ink);background:var(--paper-2)}
.eq-del-btn{width:36px;height:36px;border:none;background:transparent;color:var(--danger);
  cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;
  margin:auto;-webkit-appearance:none}
.eq-del-btn:hover{background:var(--accent-soft)}
.add-equipo-btn{margin-top:12px;width:100%}

/* ── FORM ACTIONS ───────────────────────────────────────────── */
.form-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px;
  padding-top:16px;border-top:2px solid var(--rule);align-items:center}
.form-actions-danger{margin-left:auto}
.confirm-del-inline{display:flex;align-items:center;gap:8px;
  background:var(--accent-soft);border:2px solid var(--danger);padding:8px 12px;flex-wrap:wrap}
.confirm-del-inline span{font-family:'Archivo',sans-serif;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.06em;color:var(--danger)}

/* ── MODAL ──────────────────────────────────────────────────── */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(24,22,19,.55);z-index:999}
.modal-overlay.open{display:block}
.modal{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:1000;
  background:var(--paper);border:2px solid var(--ink);
  width:min(580px,calc(100vw - 24px));max-height:85vh;
  display:none;flex-direction:column}
.modal.open{display:flex}
.modal-header{display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;border-bottom:2px solid var(--ink);background:var(--paper-2);flex-shrink:0}
.modal-title{font-family:'Archivo',sans-serif;font-size:13px;font-weight:800;
  letter-spacing:.06em;text-transform:uppercase}
.modal-close{width:32px;height:32px;border:2px solid var(--ink);background:transparent;
  font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  color:var(--ink);line-height:1;-webkit-appearance:none}
.modal-close:hover{background:var(--ink);color:var(--paper)}
.modal-body{overflow-y:auto;flex:1;padding:14px 16px}
.modal-footer{padding:12px 16px;border-top:2px solid var(--rule);background:var(--paper-2);
  flex-shrink:0;display:flex;align-items:center;justify-content:space-between;gap:12px}
.modal-total{font-family:'IBM Plex Mono',monospace;font-size:16px;font-weight:600}

.rep-head{display:grid;grid-template-columns:1fr 120px 110px 36px;gap:6px;margin-bottom:6px}
.rep-head span{font-family:'Archivo',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 2px}
.rep-row{display:grid;grid-template-columns:1fr 120px 110px 36px;gap:6px;
  align-items:start;margin-bottom:8px}
.rep-row input{padding:8px;border:1px solid var(--rule);background:var(--paper);
  font-family:'IBM Plex Sans',sans-serif;font-size:14px;width:100%;-webkit-appearance:none}
.rep-row input:focus{outline:none;border-color:var(--ink)}
.rep-price{font-family:'IBM Plex Mono',monospace}
.rep-del{width:36px;height:36px;border:none;background:transparent;cursor:pointer;
  color:var(--danger);font-size:18px;display:flex;align-items:center;justify-content:center;
  -webkit-appearance:none}
.rep-del:hover{background:var(--accent-soft)}

/* ── DOCUMENT VIEW ──────────────────────────────────────────── */
.doc{background:#fff;border:1px solid var(--rule);padding:24px 28px}

.doc-empresa-head{display:grid;grid-template-columns:1fr auto 1fr;gap:0 20px;
  align-items:start;margin-bottom:20px;padding-bottom:16px;
  border-bottom:3px double var(--ink)}
.doc-empresa-head>*{min-width:0}
.doc-empresa-info{font-size:13px;line-height:1.75;color:var(--ink-soft)}
.doc-empresa-info strong{display:block;font-family:'Archivo',sans-serif;font-size:18px;
  font-weight:800;color:var(--ink);letter-spacing:.04em}
.doc-empresa-info .esub{font-family:'Archivo',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px;display:block}

.doc-center-block{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px 20px;border-left:2px solid var(--rule);border-right:2px solid var(--rule);
  text-align:center}
.doc-type-label{font-family:'Archivo',sans-serif;font-size:22px;font-weight:800;
  letter-spacing:.12em;text-transform:uppercase;color:var(--ink);white-space:nowrap}
.doc-type-deco{font-size:10px;letter-spacing:.2em;color:var(--muted);
  text-transform:uppercase;font-family:'IBM Plex Mono',monospace;margin:3px 0}

.doc-remito-info{text-align:right;font-size:13px;line-height:1.75;
  font-family:'IBM Plex Mono',monospace;min-width:0;overflow:hidden}
.lbl-sm{font-family:'Archivo',sans-serif;font-size:10px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:block}
.doc-remito-num{font-size:clamp(13px,3.5vw,24px);font-weight:600;letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;display:block}

.doc-section-label{font-family:'Archivo',sans-serif;font-size:11px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);
  border-bottom:1px solid var(--rule);padding-bottom:4px;margin-bottom:10px}
.doc-cliente-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 24px;
  font-size:13px;margin-bottom:20px}
.kv{display:flex;gap:6px;align-items:baseline}
.kk{font-family:'Archivo',sans-serif;font-size:10px;font-weight:700;
  text-transform:uppercase;color:var(--muted);white-space:nowrap;padding-top:1px}
.vv{font-weight:500}

/* Equipment list in doc */
.doc-equipos-wrap{margin-bottom:24px}
.eq-list-head,.eq-list-row{display:grid;grid-template-columns:28px 90px 140px 1fr 88px;
  gap:0 12px;padding:8px 10px}
.eq-list-head{background:var(--ink);color:var(--paper);font-family:'Archivo',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.eq-list-row{border-bottom:1px solid var(--rule)}
.eql-n{text-align:center;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--muted)}
.eq-list-head .eql-n{color:var(--paper)}
.eql-id{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600}
.eql-desc{font-size:13px}
.eql-rep{font-size:12px;color:var(--ink-soft)}
.eql-total{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;text-align:right}
.rep-detail-list{font-family:'IBM Plex Mono',monospace;font-size:11px;
  line-height:1.7;color:var(--ink-soft)}

/* Totals */
.doc-totals{display:flex;flex-direction:column;align-items:flex-end;gap:6px;
  margin-bottom:28px;padding-top:12px;border-top:2px solid var(--ink)}
.doc-total-row{display:flex;gap:24px;align-items:baseline}
.tl{font-family:'Archivo',sans-serif;font-size:12px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tv{font-family:'IBM Plex Mono',monospace;font-size:18px;font-weight:600;
  min-width:130px;text-align:right}
.doc-total-row.grand .tv{font-size:22px;color:var(--ink)}

.doc-obs{font-size:13px;color:var(--ink-soft);border-left:3px solid var(--rule);
  padding-left:10px;margin-bottom:18px;white-space:pre-wrap}

/* Firma */
.doc-firma-section{display:grid;grid-template-columns:1fr 1fr;gap:60px;margin-top:48px}
.firma-line{border-top:1px solid var(--ink);padding-top:6px;font-family:'Archivo',sans-serif;
  font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);text-align:center}

/* ── TOAST ──────────────────────────────────────────────────── */
.toast{position:fixed;bottom:20px;right:20px;background:var(--ink);color:var(--paper);
  font-family:'Archivo',sans-serif;font-size:12px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;padding:10px 18px;z-index:3000;opacity:0;
  transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}

/* ── RESPONSIVE ─────────────────────────────────────────────── */
@media(max-width:680px){
  .form-grid{grid-template-columns:1fr}
  .span-2{grid-column:span 1}
  .toolbar-title{font-size:16px}

  /* list table → stacked */
  .list-table thead{display:none}
  .list-table tr{display:block;padding:10px 0;border-bottom:2px solid var(--rule)}
  .list-table td{display:block;padding:3px 10px;border:none;font-size:14px}
  .list-table td[data-label]::before{content:attr(data-label) ": ";
    font-family:'Archivo',sans-serif;font-size:10px;font-weight:700;
    letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .list-table .row-actions{padding-top:8px}
  .list-table .row-actions[data-label]::before{display:none}

  /* doc header mobile */
  .doc-empresa-head{
    grid-template-columns:1fr 1fr !important;
    grid-template-rows:auto auto !important;
    grid-template-areas:"presup presup" "emp rem" !important
  }
  .doc-center-block{
    grid-area:presup;border:none;border-bottom:2px solid var(--rule);
    background:var(--ink);color:var(--paper);padding:12px;
    margin:0 -28px 14px;width:calc(100% + 56px)
  }
  .doc-center-block .doc-type-label{color:var(--paper)}
  .doc-center-block .doc-type-deco{color:var(--rule-soft)}
  .doc-empresa-info{grid-area:emp}
  .doc-remito-info{grid-area:rem;text-align:right}
  .doc-cliente-grid{grid-template-columns:1fr}

  /* equipment list mobile */
  .eq-list-head{display:none}
  .eq-list-row{
    display:grid !important;
    grid-template-columns:26px 1fr auto;
    grid-template-rows:auto auto auto;
    grid-template-areas:"num id total" ". desc desc" ". rep rep";
    border-bottom:1px solid var(--rule-soft);
    padding:10px 0
  }
  .eql-n{grid-area:num}
  .eql-id{grid-area:id}
  .eql-total{grid-area:total;text-align:right}
  .eql-desc{grid-area:desc}
  .eql-rep{grid-area:rep}

  .doc-firma-section{grid-template-columns:1fr;gap:32px}

  /* modal repuestos mobile */
  .rep-head{display:none}
  .rep-row{grid-template-columns:1fr 1fr;grid-template-rows:auto auto;
    grid-template-areas:"desc del" "cod price"}
  .rep-row input:nth-child(1){grid-area:desc}
  .rep-row input:nth-child(2){grid-area:cod}
  .rep-row input:nth-child(3){grid-area:price}
  .rep-row .rep-del{grid-area:del;justify-self:end}
}

/* ── PRINT ──────────────────────────────────────────────────── */
@media print{
  @page{size:A4 portrait;margin:0;margin-top:0;margin-bottom:0}
  body{padding:14mm 15mm;background:#fff !important}
  .no-print,.toast{display:none !important}
  button:not(.doc *){display:none !important}
  #app{max-width:none;padding:0}
  .doc{border:none;padding:0}

  .doc-empresa-head{
    display:grid !important;
    grid-template-columns:1fr auto 1fr !important;
    grid-template-rows:auto !important;
    grid-template-areas:none !important
  }
  .doc-center-block{
    background:transparent !important;color:var(--ink) !important;
    border-left:2px solid var(--rule) !important;
    border-right:2px solid var(--rule) !important;
    border-bottom:none !important;margin:0 !important;width:auto !important;
    grid-area:unset !important
  }
  .doc-center-block .doc-type-label{color:var(--ink) !important}
  .doc-center-block .doc-type-deco{color:var(--muted) !important}
  .doc-empresa-info{grid-area:unset !important}
  .doc-remito-info{grid-area:unset !important}

  .eq-list-head{display:grid !important}
  .eq-list-row{
    display:grid !important;
    grid-template-columns:28px 90px 140px 1fr 88px !important;
    grid-template-areas:none !important;
    border-bottom:1px solid #cfc6b2 !important;
    padding:6px 8px !important
  }
  .eql-n,.eql-id,.eql-desc,.eql-rep,.eql-total{grid-area:unset !important;margin:0 !important}
  .doc-firma-section{grid-template-columns:1fr 1fr !important}
}
</style>
</head>

  <p>Iniciá sesión con tu cuenta de Google para continuar</p>

</div>
<div id="app"></div>

<div class="modal-overlay" id="modalOverlay"></div>
<div class="modal" id="repModal">

    <span class="modal-title" id="modalTitle">Repuestos</span>
    <button class="modal-close" id="modalClose" aria-label="Cerrar">&times;</button>
  </div>
  <div class="modal-body" id="modalBody"></div>
  <div class="modal-footer">
    <button class="btn btn-ok btn-sm" id="modalAddRep">+ Agregar repuesto</button>
    <span class="modal-total" id="modalTotal"></span>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="fileImport" accept=".json" style="display:none">

<script type="application/json" id="app-data">null</script>

};
var GOOGLE_CLIENT_ID='807094270819-tic7ira1nb10himr66fbkfv4t414gl9m.apps.googleusercontent.com';

var STORAGE_KEY='remitos:v2';

/* ── ESTADO ─────────────────────────────────────────────────── */
var state={

/* ── GOOGLE DRIVE ───────────────────────────────────────────── */
function driveReq(url,opts){
  if(!opts)opts={};
  if(!opts.headers)opts.headers={};
  opts.headers['Authorization']='Bearer '+_driveToken;
  return fetch(url,opts)
}

async function getOrCreateFolder(){
  if(_driveFolderId)return _driveFolderId;
  var q="mimeType='application/vnd.google-apps.folder' and name='"+DRIVE_FOLDER+"' and trashed=false";
  var r=await driveReq('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&fields=files(id)');
  var data=await r.json();
  if(data.files&&data.files.length){_driveFolderId=data.files[0].id;return _driveFolderId}
  var cr=await driveReq('https://www.googleapis.com/drive/v3/files',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({name:DRIVE_FOLDER,mimeType:'application/vnd.google-apps.folder'})
  });
  var folder=await cr.json();
  _driveFolderId=folder.id;return _driveFolderId
}

async function loadFromDrive(){
  if(!_driveToken)return null;
  try{
    var fid=await getOrCreateFolder();
    var q="'"+fid+"' in parents and mimeType='application/json' and trashed=false";
    var r=await driveReq('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&fields=files(id,name)&pageSize=1000');
    var data=await r.json();
    if(!data.files||!data.files.length)return [];
    var remitos=[];
    for(var i=0;i<data.files.length;i++){
      var fr=await driveReq('https://www.googleapis.com/drive/v3/files/'+data.files[i].id+'?alt=media');
      try{remitos.push(await fr.json())}catch(e){}
    }
    return remitos
  }catch(e){return null}
}

async function saveToDrive(rem){
  if(!_driveToken)return;
  try{
    var fid=await getOrCreateFolder();
    var fname=rem.id+'.json';
    var q="'"+fid+"' in parents and name='"+fname+"' and trashed=false";
    var sr=await driveReq('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&fields=files(id)');
    var sd=await sr.json();
    var body=JSON.stringify(rem);
    if(sd.files&&sd.files.length){
      await driveReq('https://www.googleapis.com/upload/drive/v3/files/'+sd.files[0].id+'?uploadType=media',{
        method:'PATCH',headers:{'Content-Type':'application/json'},body:body
      })
    }else{
      var meta=JSON.stringify({name:fname,parents:[fid]});
      var form=new FormData();
      form.append('metadata',new Blob([meta],{type:'application/json'}));
      form.append('file',new Blob([body],{type:'application/json'}));
      await driveReq('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart',{method:'POST',body:form})
    }
  }catch(e){}
}

async function deleteFromDrive(id){
  if(!_driveToken)return;
  try{
    var fid=await getOrCreateFolder();
    var fname=id+'.json';
    var q="'"+fid+"' in parents and name='"+fname+"' and trashed=false";
    var sr=await driveReq('https://www.googleapis.com/drive/v3/files?q='+encodeURIComponent(q)+'&fields=files(id)');
    var sd=await sr.json();
    if(sd.files&&sd.files.length){
      await driveReq('https://www.googleapis.com/drive/v3/files/'+sd.files[0].id,{method:'DELETE'})
    }
  }catch(e){}
}

async function syncFromDrive(){
  if(!_driveToken){showToast('Sin sesión de Drive');return}
  showToast('Sincronizando con Drive...');
  var remitos=await loadFromDrive();
  if(remitos===null){showToast('Error al conectar con Drive');return}
  if(remitos.length){
    state.remitos=remitos;sortRems();persist();render();
    showToast('Sincronizado: '+remitos.length+' remitos')
  }else{
    showToast('Drive vacío, subiendo datos locales...');
    for(var i=0;i<state.remitos.length;i++)await saveToDrive(state.remitos[i]);
    showToast('Subidos '+state.remitos.length+' remitos a Drive')
  }
  renderFileStatus()
}

/* ── UTILIDADES ─────────────────────────────────────────────── */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){return new Date().toISOString().slice(0,10)}
function fmtDate(d){if(!d)return '';var p=d.split('-');return p[2]+'/'+p[1]+'/'+p[0]}
function fmtPrice(n){
  var num=parseFloat(n)||0;
  return '$ '+num.toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:2})
}
function eqTotal(eq){return(eq.repuestos||[]).reduce(function(s,r){return s+(parseFloat(r.precio)||0)},0)}
function remTotal(r){return(r.equipos||[]).reduce(function(s,e){return s+eqTotal(e)},0)}
function nextNum(){
  if(!state.remitos.length)return'0001';
  var mx=Math.max.apply(null,state.remitos.map(function(r){return parseInt(r.numero,10)||0}));
  return String(mx+1).padStart(4,'0')
}
function newEq(){return{id:'',marca:'',modelo:'',tipo:'',repuestos:[]}}
function newRem(){return{
  id:uid(),numero:nextNum(),fechaRecibido:today(),fechaEntregado:'',
  cliente:{nombre:'',telefono:'',email:'',cuit:'',domicilio:''},
  observaciones:'',hideRepDetail:false,equipos:[newEq()],
  createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()
}}
function clone(o){return JSON.parse(JSON.stringify(o))}
function esc(s){
  return String(s||'')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

/* ── PERSISTENCIA ───────────────────────────────────────────── */
function sortRems(){state.remitos.sort(function(a,b){return parseInt(b.numero,10)-parseInt(a.numero,10)})}

/* ── IndexedDB (persiste el handle de carpeta entre sesiones) ── */
function openDB(){
  return new Promise(function(res,rej){
    var r=indexedDB.open('servimac',1);
    r.onupgradeneeded=function(e){e.target.result.createObjectStore('kv')};
    r.onsuccess=function(e){res(e.target.result)};
    r.onerror=rej
  })
}
async function dbGet(key){
  try{
    var db=await openDB();
    return new Promise(function(res){
      var r=db.transaction('kv').objectStore('kv').get(key);
      r.onsuccess=function(){res(r.result||null)};
      r.onerror=function(){res(null)}
    })
  }catch(e){return null}
}
async function dbSet(key,val){
  try{
    var db=await openDB();
    return new Promise(function(res,rej){
      var tx=db.transaction('kv','readwrite');
      tx.objectStore('kv').put(val,key);
      tx.oncomplete=res;tx.onerror=rej
    })
  }catch(e){}
}

/* ── DIRECTORIO ─────────────────────────────────────────────── */
function remFilename(rem){return'remito-'+rem.numero+'.json'}

async function pickDirectory(){
  if(!('showDirectoryPicker'in window)){
    showToast('Usá Chrome o Edge para esta función');return
  }
  try{
    var h=await window.showDirectoryPicker({mode:'readwrite'});
    dirHandle=h;
    await dbSet('dirHandle',h);
    var loaded=await loadFromDir();
    state.remitos=loaded.length?loaded:clone(SAMPLE);
    sortRems();
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state.remitos));
    renderFileStatus();
    render();
    showToast('Carpeta: '+h.name)
  }catch(e){}
}

async function loadFromDir(){
  var remitos=[];
  try{
    for await(var entry of dirHandle.values()){
      if(entry.kind==='file'&&entry.name.startsWith('remito-')&&entry.name.endsWith('.json')){
        try{
          var f=await entry.getFile();
          var t=await f.text();
          var r=JSON.parse(t);
          if(r&&r.id)remitos.push(r)
        }catch(e){}
      }
    }
  }catch(e){}
  return remitos
}

async function writeRem(rem){
  if(!dirHandle)return;
  try{
    var fh=await dirHandle.getFileHandle(remFilename(rem),{create:true});
    var w=await fh.createWritable();
    await w.write(JSON.stringify(rem,null,2));
    await w.close()
  }catch(e){}
}

async function deleteRemFile(rem){
  if(!dirHandle)return;
  try{await dirHandle.removeEntry(remFilename(rem))}catch(e){}
}

/* ── CARGA INICIAL ──────────────────────────────────────────── */
async function loadAll(){
  if('showDirectoryPicker'in window){
    try{
      var h=await dbGet('dirHandle');
      if(h){
        var perm=await h.queryPermission({mode:'readwrite'});
        if(perm==='granted'){
          dirHandle=h;
          state.remitos=await loadFromDir()
        }else{
          // handle guardado pero sin permiso aún — se pedirá al hacer clic
          dirHandle=null;
          state._savedHandle=h
        }
      }
    }catch(e){}
  }
  if(!dirHandle){
    try{var ls=localStorage.getItem(STORAGE_KEY);state.remitos=ls?JSON.parse(ls):[]}
    catch(e){state.remitos=[]}
  }
  if(!state.remitos.length){
    var driveData=await loadFromDrive();
    if(driveData&&driveData.length){state.remitos=driveData;persist()}
    else{state.remitos=clone(SAMPLE)}
  }
  sortRems()
}

function persist(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(state.remitos))
}
function debouncePersist(){clearTimeout(state.saveTimer);state.saveTimer=setTimeout(persist,400)}

function renderFileStatus(){
  var bar=document.getElementById('fileStatusBar');
  if(!bar)return;
  bar.style.display='flex';
  var html=(_driveToken
    ?'<span style="color:var(--ok);font-weight:600">● Drive conectado</span><button class="btn btn-outline btn-sm" onclick="syncFromDrive()">Sincronizar</button>'
    :'<span style="color:var(--danger);font-weight:600">● Drive desconectado</span><button class="btn btn-outline btn-sm" onclick="connectDrive()">Conectar Drive</button>');

  bar.innerHTML=html
}

async function reconnectDir(){
  if(!state._savedHandle)return;
  try{
    var perm=await state._savedHandle.requestPermission({mode:'readwrite'});
    if(perm==='granted'){
      dirHandle=state._savedHandle;
      state._savedHandle=null;
      state.remitos=await loadFromDir();
      if(!state.remitos.length)state.remitos=clone(SAMPLE);
      sortRems();persist();
      renderFileStatus();render();
      showToast('Reconectado: '+dirHandle.name)
    }
  }catch(e){}
}

function goEdit(id){
  var r=state.remitos.find(function(x){return x.id===id});if(!r)return;
  state.view='form';state.editId=id;state.draft=clone(r);state.confirmDelete=false;render()
}
function goDoc(id){
  var r=state.remitos.find(function(x){return x.id===id});if(!r)return;
  state.view='doc';state.editId=id;render()
}

/* ── CRUD ───────────────────────────────────────────────────── */
function saveRem(){
  var d=state.draft;d.updatedAt=new Date().toISOString();
  var oldNumero=null;
  if(state.editId){
    var i=state.remitos.findIndex(function(r){return r.id===state.editId});
    if(i!==-1){
      if(state.remitos[i].numero!==d.numero)oldNumero=state.remitos[i].numero;
      state.remitos[i]=d
    }
  }else{d.createdAt=new Date().toISOString();state.remitos.push(d)}
  sortRems();persist();
  writeRem(d);
  if(oldNumero)deleteRemFile({numero:oldNumero});
  saveToDrive(d)
}
function deleteRem(id){
  var rem=state.remitos.find(function(r){return r.id===id});
  state.remitos=state.remitos.filter(function(r){return r.id!==id});
  persist();
  if(rem){deleteRemFile(rem);deleteFromDrive(rem.id)}
}
function duplicateRem(id){
  var r=state.remitos.find(function(x){return x.id===id});if(!r)return;
  state.view='form';state.editId=null;
  state.draft={id:uid(),numero:nextNum(),fechaRecibido:today(),fechaEntregado:'',
    cliente:clone(r.cliente),observaciones:'',hideRepDetail:false,equipos:[newEq()],
    createdAt:new Date().toISOString(),updatedAt:new Date().toISOString()};
  state.confirmDelete=false;render()
}

async function exportJSON(){
  var data=JSON.stringify(state.remitos,null,2);
  var blob=new Blob([data],{type:'application/json'});
  var fname='remitos-servimac-'+today()+'.json';
  if('showSaveFilePicker'in window){
    try{
      var h=await window.showSaveFilePicker({suggestedName:fname,
        types:[{description:'JSON',accept:{'application/json':['.json']}}]});
      var w=await h.createWritable();await w.write(blob);await w.close();
      showToast('Exportado');return
    }catch(e){}
  }
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;a.click();
  URL.revokeObjectURL(a.href);showToast('Exportado')
}
function importJSON(){document.getElementById('fileImport').click()}

document.getElementById('fileImport').addEventListener('change',function(){
  var file=this.files[0];if(!file)return;
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      if(!Array.isArray(data))throw new Error();
      state.remitos=data;sortRems();persist();
      if(dirHandle)data.forEach(function(r){writeRem(r)});
      showToast('Importado: '+data.length+' remitos');goList()
    }catch(err){showToast('Error al importar')}
  };
  reader.readAsText(file);this.value=''
});

  state.draft.equipos.forEach(function(eq,i){
    var tot=eqTotal(eq),nr=(eq.repuestos||[]).length;
    var lbl=nr===0?'Sin repuestos':nr+' repuesto'+(nr!==1?'s':'')+' · '+fmtPrice(tot);
    html+='<div class="eq-row">'
      +'<div class="eq-cell eq-num">'+(i+1)+'</div>'
      +'<div class="eq-cell"><input type="text" placeholder="ID" value="'+esc(eq.id)+'" data-ei="'+i+'" data-ef="id"></div>'
      +'<div class="eq-cell"><input type="text" placeholder="Marca" value="'+esc(eq.marca)+'" data-ei="'+i+'" data-ef="marca"></div>'
      +'<div class="eq-cell"><input type="text" placeholder="Modelo" value="'+esc(eq.modelo)+'" data-ei="'+i+'" data-ef="modelo"></div>'
      +'<div class="eq-cell"><input type="text" placeholder="Tipo" value="'+esc(eq.tipo)+'" data-ei="'+i+'" data-ef="tipo"></div>'
      +'<div class="eq-cell"><button class="eq-rep-btn" data-openm="'+i+'">'+esc(lbl)+'</button></div>'
      +'<div class="eq-cell"><button class="eq-del-btn" data-deq="'+i+'" title="Eliminar equipo">&times;</button></div>'
      +'</div>'
  });
  html+='</div>';
  wrap.innerHTML=html;

  wrap.querySelectorAll('input[data-ei]').forEach(function(inp){
    inp.addEventListener('input',function(){
      state.draft.equipos[+this.dataset.ei][this.dataset.ef]=this.value;debouncePersist()
    })
  });
  wrap.querySelectorAll('[data-openm]').forEach(function(btn){
    btn.addEventListener('click',function(){openModal(+this.dataset.openm)})
  });
  wrap.querySelectorAll('[data-deq]').forEach(function(btn){
    btn.addEventListener('click',function(){
      if(state.draft.equipos.length<=1){showToast('Debe haber al menos un equipo');return}
      state.draft.equipos.splice(+this.dataset.deq,1);renderEqTable();debouncePersist()
    })
  });
  bindScroll(wrap)
}

/* ── RENDER: LISTA ──────────────────────────────────────────── */
function renderList(){
  var q=state.search.toLowerCase();
  var list=state.remitos.filter(function(r){
    if(!q)return true;
    var em=(r.equipos||[]).some(function(e){
      return(e.id||'').toLowerCase().includes(q)||(e.marca||'').toLowerCase().includes(q)
    });
    return(r.numero||'').includes(q)||(r.cliente.nombre||'').toLowerCase().includes(q)||em
  });

  var authName=localStorage.getItem('auth_name')||localStorage.getItem('auth_email')||'';
  var html='<div class="toolbar no-print">'
    +'<div style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:0">'
    +'<span class="toolbar-title">SERVIMAC</span>'
    +(authName?'<span style="font-size:12px;color:var(--accent);font-family:\'IBM Plex Sans\',sans-serif;font-weight:600">● '+esc(authName)+'</span>'+'<button class="btn btn-outline btn-sm" style="align-self:flex-start;min-height:28px;font-size:11px;padding:0 10px;margin-top:2px" onclick="logout()">Cerrar sesión</button>':'')
    +'</div>'
    +'<button class="btn btn-accent" onclick="goNew()">+ Nuevo remito</button>'
    +'<button class="btn btn-outline btn-sm" onclick="exportJSON()">Exportar</button>'
    +'<button class="btn btn-outline btn-sm" onclick="importJSON()">Importar</button>'
    +'</div>';

  html+='<div id="fileStatusBar" class="file-status-bar no-print" style="display:none"></div>';
  html+='<div class="search-wrap no-print"><input type="search" id="searchInput" placeholder="Buscar por N°, cliente, ID de equipo, marca…" value="'+esc(state.search)+'"></div>';

  if(!list.length){
    html+='<div class="empty-state"><p>Sin resultados</p><button class="btn btn-accent" onclick="goNew()">+ Nuevo remito</button></div>'
  }else{
    html+='<table class="list-table"><thead><tr>'
      +'<th>N°</th><th>Cliente</th><th>Recibido</th><th>Entregado</th><th>Total</th><th class="no-print"></th>'
      +'</tr></thead><tbody>';
    list.forEach(function(r){
      var tot=remTotal(r);
      html+='<tr>'
        +'<td data-label="N°" class="mono">'+esc(r.numero)+'</td>'
        +'<td data-label="Cliente">'+esc(r.cliente.nombre||'—')+'</td>'
        +'<td data-label="Recibido" class="mono">'+fmtDate(r.fechaRecibido)+'</td>'
        +'<td data-label="Entregado">'+(r.fechaEntregado
          ?'<span class="mono">'+fmtDate(r.fechaEntregado)+'</span>'
          :'<span class="badge-pend">PENDIENTE</span>')+'</td>'
        +'<td data-label="Total" class="mono">'+fmtPrice(tot)+'</td>'
        +'<td class="no-print"><div class="row-actions">'
        +'<button class="btn btn-sm" onclick="goDoc(\''+r.id+'\')">Ver</button>'
        +'<button class="btn btn-outline btn-sm" onclick="goEdit(\''+r.id+'\')">Editar</button>'
        +'</div></td></tr>'
    });
    html+='</tbody></table>'
  }

  document.getElementById('app').innerHTML=html;
  renderFileStatus();
  var si=document.getElementById('searchInput');
  if(si){si.addEventListener('input',function(){state.search=this.value;renderList()});si.focus();si.setSelectionRange(si.value.length,si.value.length)}
}

/* ── RENDER: FORMULARIO ─────────────────────────────────────── */
function renderForm(){
  var d=state.draft,isEdit=!!state.editId;
  var html='<div class="toolbar no-print">'
    +'<button class="btn btn-outline btn-sm" onclick="goList()">← Volver</button>'
    +'<span class="toolbar-title">'+(isEdit?'Editar remito':'Nuevo remito')+'</span>'
    +'</div>';

  /* Datos del remito */
  html+='<div class="form-section"><div class="form-section-title">Datos del remito</div>'
    +'<div class="form-section-body"><div class="form-grid">'
    +'<div class="field field-mono"><label>N° de remito</label><input type="text" id="fNum" value="'+esc(d.numero)+'" placeholder="0001"></div>'
    +'<div class="field"></div>'
    +'<div class="field field-mono"><label>Fecha recibido</label><input type="date" id="fFR" value="'+esc(d.fechaRecibido)+'"></div>'
    +'<div class="field field-mono"><label>Fecha entregado</label><input type="date" id="fFE" value="'+esc(d.fechaEntregado)+'"></div>'
    +'</div></div></div>';

  /* Cliente */
  html+='<div class="form-section"><div class="form-section-title">Datos del cliente</div>'
    +'<div class="form-section-body"><div class="form-grid">'
    +'<div class="field span-2"><label>Nombre / Razón Social</label><input type="text" id="fCN" value="'+esc(d.cliente.nombre)+'"></div>'
    +'<div class="field field-mono"><label>CUIT</label><input type="text" id="fCC" value="'+esc(d.cliente.cuit)+'" placeholder="20-00000000-0"></div>'
    +'<div class="field field-mono"><label>Teléfono</label><input type="tel" id="fCT" value="'+esc(d.cliente.telefono)+'"></div>'
    +'<div class="field"><label>Email</label><input type="email" id="fCE" value="'+esc(d.cliente.email)+'"></div>'
    +'<div class="field span-2"><label>Domicilio</label><input type="text" id="fCD" value="'+esc(d.cliente.domicilio)+'"></div>'
    +'</div></div></div>';

  /* Observaciones */
  html+='<div class="form-section"><div class="form-section-title">Observaciones</div>'
    +'<div class="form-section-body"><textarea id="fObs" rows="3">'+esc(d.observaciones)+'</textarea></div></div>';

  /* Equipos */
  html+='<div class="form-section"><div class="form-section-title">Equipos</div>'
    +'<div class="form-section-body"><div id="eqTableWrap"></div>'
    +'<button class="btn btn-ok add-equipo-btn" id="btnAddEq">+ Agregar equipo</button>'
    +'</div></div>';

  /* Acciones */
  html+='<div class="form-actions no-print">'
    +'<button class="btn btn-accent" id="btnSave">Guardar remito</button>';
  if(isEdit){
    html+='<button class="btn btn-outline btn-sm" onclick="duplicateRem(\''+state.editId+'\')">Duplicar (nuevo)</button>'
      +'<div class="form-actions-danger">';
    if(state.confirmDelete){
      html+='<div class="confirm-del-inline">'
        +'<span>¿Eliminar definitivamente?</span>'
        +'<button class="btn btn-danger btn-sm" id="btnConfDel">Sí, eliminar</button>'
        +'<button class="btn btn-outline btn-sm" id="btnCancelDel">Cancelar</button>'
        +'</div>'
    }else{
      html+='<button class="btn btn-outline btn-sm" id="btnDel" style="color:var(--danger);border-color:var(--danger)">Eliminar remito</button>'
    }
    html+='</div>'
  }
  html+='</div>';

  document.getElementById('app').innerHTML=html;
  renderEqTable();
  bindScroll(document.getElementById('app'));

  /* Bindings */
  function bf(id,fn){var el=document.getElementById(id);if(el)el.addEventListener('input',function(){fn(this.value);debouncePersist()})}
  bf('fNum',function(v){d.numero=v});
  bf('fFR',function(v){d.fechaRecibido=v});
  bf('fFE',function(v){d.fechaEntregado=v});
  bf('fCN',function(v){d.cliente.nombre=v});
  bf('fCC',function(v){d.cliente.cuit=v});
  bf('fCT',function(v){d.cliente.telefono=v});
  bf('fCE',function(v){d.cliente.email=v});
  bf('fCD',function(v){d.cliente.domicilio=v});
  bf('fObs',function(v){d.observaciones=v});

  document.getElementById('btnAddEq').addEventListener('click',function(){
    d.equipos.push(newEq());renderEqTable();
    setTimeout(function(){
      var w=document.getElementById('eqTableWrap');
      if(w)w.scrollIntoView({behavior:'smooth',block:'end'})
    },100)
  });

  document.getElementById('btnSave').addEventListener('click',function(){
    if(!d.numero.trim()){showToast('El número de remito es obligatorio');return}
    if(!d.cliente.nombre.trim()){showToast('El nombre del cliente es obligatorio');return}
    var savedId=state.draft.id;saveRem();showToast('Remito guardado');
    state.view='doc';state.editId=savedId;render()
  });

  if(isEdit){
    var btnDel=document.getElementById('btnDel');
    if(btnDel)btnDel.addEventListener('click',function(){state.confirmDelete=true;renderForm()});
    var btnConf=document.getElementById('btnConfDel');
    if(btnConf)btnConf.addEventListener('click',function(){deleteRem(state.editId);showToast('Remito eliminado');goList()});
    var btnCan=document.getElementById('btnCancelDel');
    if(btnCan)btnCan.addEventListener('click',function(){state.confirmDelete=false;renderForm()});
  }
}

/* ── RENDER: DOCUMENTO ──────────────────────────────────────── */
function renderDoc(){
  var rem=(state.draft&&state.draft.id===state.editId)
    ? state.draft
    : state.remitos.find(function(r){return r.id===state.editId});
  if(!rem){goList();return}

  var eqs=(rem.equipos||[]).filter(function(e){
    return e.id||e.marca||e.modelo||e.tipo||(e.repuestos&&e.repuestos.length)
  });
  var grandTotal=eqs.reduce(function(s,e){return s+eqTotal(e)},0);

  var deslbl=state.docHideDetail?'Mostrar desglose':'Ocultar desglose';
  var html='<div class="toolbar no-print">'
    +'<button class="btn btn-outline btn-sm" onclick="goList()">← Volver</button>'
    +'<button class="btn btn-outline btn-sm" onclick="goEdit(\''+rem.id+'\')">Editar</button>'
    +'<button class="btn btn-outline btn-sm" onclick="state.docHideDetail=!state.docHideDetail;renderDoc()">'+deslbl+'</button>'
    +'<button class="btn btn-accent" onclick="window.print()">Imprimir / PDF</button>'
    +'</div>';

  html+='<div class="doc">';

  /* Cabecera */
  html+='<div class="doc-empresa-head">'
    +'<div class="doc-empresa-info">'
    +'<strong>'+esc(EMPRESA.nombre)+'</strong>'
    +'<span class="esub">'+esc(EMPRESA.subtitulo)+'</span>'
    +esc(EMPRESA.direccion)+'<br>'
    +'Tel: '+esc(EMPRESA.telefono)+'<br>'
    +esc(EMPRESA.email)+'<br>'
    +'CUIT: '+esc(EMPRESA.cuit)
    +'</div>'
    +'<div class="doc-center-block">'
    +'<div class="doc-type-deco">&#9632; &#9632; &#9632;</div>'
    +'<div class="doc-type-label">PRESUPUESTO</div>'
    +'<div class="doc-type-deco">&#9632; &#9632; &#9632;</div>'
    +'</div>'
    +'<div class="doc-remito-info">'
    +'<span class="lbl-sm">Remito</span>'
    +'<div class="doc-remito-num">N&#176; '+esc(rem.numero)+'</div><br>';
  if(rem.fechaRecibido)html+='<span class="lbl-sm">Recibido</span>'+fmtDate(rem.fechaRecibido)+'<br>';
  if(rem.fechaEntregado){
    html+='<span class="lbl-sm">Entregado</span>'+fmtDate(rem.fechaEntregado)
  }else{
    html+='<span class="lbl-sm">Estado</span><span style="color:var(--ink);font-weight:600">PENDIENTE</span>'
  }
  html+='</div></div>';

  /* Cliente */
  html+='<div class="doc-section-label">Datos del cliente</div>'
    +'<div class="doc-cliente-grid">'
    +'<div class="kv"><span class="kk">Cliente</span><span class="vv">'+esc(rem.cliente.nombre||'—')+'</span></div>'
    +'<div class="kv"><span class="kk">CUIT</span><span class="vv mono">'+esc(rem.cliente.cuit||'—')+'</span></div>'
    +'<div class="kv"><span class="kk">Tel</span><span class="vv mono">'+esc(rem.cliente.telefono||'—')+'</span></div>'
    +'<div class="kv"><span class="kk">Email</span><span class="vv">'+esc(rem.cliente.email||'—')+'</span></div>'
    +'<div class="kv"><span class="kk">Domicilio</span><span class="vv">'+esc(rem.cliente.domicilio||'—')+'</span></div>'
    +'</div>';

  /* Observaciones */
  if(rem.observaciones){
    html+='<div class="doc-section-label">Observaciones</div>'
      +'<div class="doc-obs">'+esc(rem.observaciones)+'</div>'
  }

  /* Equipos */
  html+='<div class="doc-section-label">Equipos</div><div class="doc-equipos-wrap">';
  html+='<div class="eq-list-head">'
    +'<span class="eql-n">#</span><span class="eql-id">ID / Equipo</span>'
    +'<span class="eql-desc">Descripci&oacute;n</span>'
    +'<span class="eql-rep">Repuestos / Trabajo</span>'
    +'<span class="eql-total" style="text-align:right">Total</span></div>';

  eqs.forEach(function(eq,i){
    var tot=eqTotal(eq);
    var desc=[eq.marca,eq.modelo,eq.tipo].filter(Boolean).join(' · ');
    html+='<div class="eq-list-row">'
      +'<span class="eql-n">'+(i+1)+'</span>'
      +'<span class="eql-id">'+esc(eq.id||'—')+'</span>'
      +'<span class="eql-desc">'+esc(desc||'—')+'</span>'
      +'<span class="eql-rep">';
    if(eq.repuestos&&eq.repuestos.length){
      html+='<div class="rep-detail-list">';
      eq.repuestos.forEach(function(r){
        if(state.docHideDetail){
          html+=esc(r.descripcion)+'<br>'
        }else{
          var cod=r.codigo?' ['+r.codigo+']':'';
          var pr=r.precio?' — '+fmtPrice(r.precio):'';
          html+=esc(r.descripcion)+esc(cod)+esc(pr)+'<br>'

    }else{html+='<span style="color:var(--muted)">—</span>'}
    html+='</span>'
      +'<span class="eql-total">'+(tot>0?fmtPrice(tot):'—')+'</span>'
      +'</div>'
  });
  html+='</div>';

  /* Totales */
  html+='<div class="doc-totals">'
    +'<div class="doc-total-row grand"><span class="tl" style="color:var(--ink)">Total presupuesto</span>'
    +'<span class="tv">'+fmtPrice(grandTotal)+'<span style="color:var(--ink)"> + IVA</span></span></div></div>';

  /* Firma */

  html+='</div>';
  document.getElementById('app').innerHTML=html
}

/* ── PRINT HOOKS ────────────────────────────────────────────── */
var _savedTitle='';
window.onbeforeprint=function(){
  _savedTitle=document.title;document.title='';
  document.querySelectorAll('.no-print').forEach(function(el){
    el.setAttribute('data-pw',el.style.display||'');el.style.display='none'
  })
};
window.onafterprint=function(){
  document.title=_savedTitle;
  document.querySelectorAll('.no-print').forEach(function(el){
    el.style.display=el.getAttribute('data-pw')||''
  })
};
if(window.matchMedia){
  var _mq=window.matchMedia('print');
  if(_mq.addEventListener){
    _mq.addEventListener('change',function(mq){if(mq.matches)window.onbeforeprint();else window.onafterprint()})
  }
}

/* ── RENDER CENTRAL ─────────────────────────────────────────── */
function render(){
  if(state.view==='list')renderList();
  else if(state.view==='form')renderForm();
  else if(state.view==='doc')renderDoc()
}

function connectDrive(){
  try{
    if(!_tokenClient){
      _tokenClient=google.accounts.oauth2.initTokenClient({
        client_id:GOOGLE_CLIENT_ID,
        scope:'https://www.googleapis.com/auth/drive.file',
        callback:function(tokenResp){
          if(tokenResp.access_token){
            _driveToken=tokenResp.access_token;
            setTimeout(function(){if(_tokenClient)_tokenClient.requestAccessToken({prompt:''})},55*60*1000);
            renderFileStatus();
            showToast('Drive conectado')
          }
        }
      })
    }
    _tokenClient.requestAccessToken({prompt:'consent'})
  }catch(e){showToast('Error al conectar Drive')}
}

function logout(){
  localStorage.removeItem('auth_email');localStorage.removeItem('auth_name');
  _driveToken=null;_tokenClient=null;
  if(window.google&&google.accounts&&google.accounts.id){
    google.accounts.id.disableAutoSelect();
    document.getElementById('loginDenied').style.display='none';
    showLogin();
    document.getElementById('googleBtn').innerHTML='';
    google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:handleCredential});
    google.accounts.id.renderButton(document.getElementById('googleBtn'),{theme:'outline',size:'large',text:'signin_with'});
  }else{
    showLogin();
  }
}

/* ── AUTH ───────────────────────────────────────────────────── */
function showApp(){
  document.getElementById('loginScreen').classList.remove('visible');
  document.getElementById('app').style.display='';
}
function showLogin(){
  document.getElementById('loginScreen').classList.add('visible');
  document.getElementById('app').style.display='none';
}
var _tokenClient=null;
function handleCredential(response){
  var payload=JSON.parse(atob(response.credential.split('.')[1]));
  var email=payload.email||'';
  if(ALLOWED_EMAILS.indexOf(email)<0){
    document.getElementById('loginDenied').style.display='block';
    return;
  }
  localStorage.setItem('auth_email',email);
  localStorage.setItem('auth_name',payload.name||email);
  showApp();
  loadAll().then(function(){render();renderFileStatus()});
  // Pedir access token para Drive
  try{
    _tokenClient=google.accounts.oauth2.initTokenClient({
      client_id:GOOGLE_CLIENT_ID,
      scope:'https://www.googleapis.com/auth/drive.file',
      callback:function(tokenResp){
        if(tokenResp.access_token){
          _driveToken=tokenResp.access_token;
          setTimeout(function(){if(_tokenClient)_tokenClient.requestAccessToken({prompt:''})},55*60*1000);
          renderFileStatus()
        }
      }
    });
    _tokenClient.requestAccessToken({prompt:''});
  }catch(e){}
}
function initAuth(){
  var saved=localStorage.getItem('auth_email');
  if(saved&&ALLOWED_EMAILS.indexOf(saved)>=0){
    showApp();
    // Cargar app inmediatamente con datos locales
    loadAll().then(function(){render();renderFileStatus()});
    // Intentar obtener token de Drive en paralelo (silencioso)
    try{
      _tokenClient=google.accounts.oauth2.initTokenClient({
        client_id:GOOGLE_CLIENT_ID,
        scope:'https://www.googleapis.com/auth/drive.file',
        callback:function(tokenResp){
          if(tokenResp.access_token){
            _driveToken=tokenResp.access_token;
            setTimeout(function(){if(_tokenClient)_tokenClient.requestAccessToken({prompt:''})},55*60*1000);
            renderFileStatus()
          }
        }
      });
      _tokenClient.requestAccessToken({prompt:''});
    }catch(e){}
    return;
  }
  showLogin();
  google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:handleCredential});
  google.accounts.id.renderButton(document.getElementById('googleBtn'),{theme:'outline',size:'large',text:'signin_with'});
}

/* ── INIT ───────────────────────────────────────────────────── */
if(window.google){initAuth()}
else{
  var _gsiScript=document.querySelector('script[src*="accounts.google.com"]');
  if(_gsiScript)_gsiScript.addEventListener('load',initAuth);
}
</script>
